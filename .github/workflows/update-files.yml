name: Auto Update File List with Metadata

on:
  push:
    paths:
      - 'files/**'
      - 'files.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg exiftool

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate File List with Metadata (Node.js)
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");
        const { execSync } = require("child_process");

        const folderPath = path.join(process.cwd(), "files");
        if (!fs.existsSync(folderPath)) {
          console.error("Папка files не найдена");
          process.exit(1);
        }

        function getFileType(ext) {
          const imageExts = [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".tiff", ".webp"];
          const videoExts = [".mp4", ".avi", ".mov", ".mkv", ".webm", ".flv", ".wmv"];
          const audioExts = [".mp3", ".wav", ".flac", ".aac", ".ogg", ".m4a"];
          const lower = ext.toLowerCase();
          if (imageExts.includes(lower)) return "image";
          if (videoExts.includes(lower)) return "video";
          if (audioExts.includes(lower)) return "audio";
          return "other";
        }

        function getImageMetadata(filePath) {
          try {
            const output = execSync(`exiftool -CreateDate -ImageWidth -ImageHeight -j "${filePath}"`, { encoding: "utf8" });
            const data = JSON.parse(output)[0];
            return {
              width: data.ImageWidth || null,
              height: data.ImageHeight || null,
              date: data.CreateDate || null
            };
          } catch (e) {
            return { width: null, height: null, date: null };
          }
        }

        function getMediaMetadata(filePath) {
          try {
            const output = execSync(`ffprobe -v quiet -print_format json -show_format -show_streams "${filePath}"`, { encoding: "utf8" });
            const data = JSON.parse(output);
            const format = data.format;
            const streams = data.streams;

            let duration = format.duration ? parseFloat(format.duration) : null;
            let bitrate = format.bit_rate ? parseInt(format.bit_rate) : null;
            let sampleRate = null;
            let width = null, height = null;
            let codec = null;

            for (const stream of streams) {
              if (stream.codec_type === "video") {
                width = stream.width || null;
                height = stream.height || null;
                codec = stream.codec_name || null;
              } else if (stream.codec_type === "audio") {
                sampleRate = stream.sample_rate ? parseInt(stream.sample_rate) : null;
                if (!codec) codec = stream.codec_name || null;
              }
            }

            return {
              duration: duration,
              bitrate: bitrate,
              sampleRate: sampleRate,
              width: width,
              height: height,
              codec: codec
            };
          } catch (e) {
            return { duration: null, bitrate: null, sampleRate: null, width: null, height: null, codec: null };
          }
        }

        const files = fs.readdirSync(folderPath).filter(f => !f.startsWith("."));
        files.sort((a, b) => a.localeCompare(b));

        const result = files.map(file => {
          const filePath = path.join(folderPath, file);
          const stats = fs.statSync(filePath);
          const bytes = stats.size;
          const ext = path.extname(file);
          const type = getFileType(ext);

          let sizeStr = "";
          if (bytes >= 1048576) {
            sizeStr = (bytes / 1048576).toFixed(1) + " МБ";
          } else {
            sizeStr = (bytes / 1024).toFixed(1) + " КБ";
          }

          let metadata = {};
          if (type === "image") {
            metadata = getImageMetadata(filePath);
          } else if (type === "video" || type === "audio") {
            metadata = getMediaMetadata(filePath);
          }

          return {
            name: file,
            size: sizeStr,
            type: type,
            metadata: metadata,
            modified: stats.mtime.toISOString()
          };
        });

        // Сохраняем статистику в stats.json (для будущего использования)
        const stats = {
          totalFiles: result.length,
          totalSize: result.reduce((acc, f) => acc + parseFloat(f.size) * (f.size.includes("МБ") ? 1048576 : 1024), 0),
          lastUpdated: new Date().toISOString(),
          types: {}
        };
        result.forEach(f => {
          const t = f.type || "other";
          stats.types[t] = (stats.types[t] || 0) + 1;
        });
        fs.writeFileSync("stats.json", JSON.stringify(stats, null, 2));

        // Вставляем массив в files.html
        const jsonStr = JSON.stringify(result, null, 2);
        const htmlPath = path.join(process.cwd(), "files.html");
        let htmlContent = fs.readFileSync(htmlPath, "utf8");
        htmlContent = htmlContent.replace(
          /const fileData = \[\s*([\s\S]*?)\s*\];/,
          `const fileData = ${jsonStr};`
        );
        fs.writeFileSync(htmlPath, htmlContent, "utf8");
        console.log("✅ files.html обновлён с метаданными!");
        '

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add files.html stats.json
        git commit --allow-empty -m "chore: auto-update file list with metadata [skip ci]" || true
        git pull --rebase origin main || true
        git push origin main || true

    # ===== НОВЫЙ ШАГ: УВЕДОМЛЕНИЕ В TELEGRAM =====
    - name: Wait for GitHub Pages Deployment & Notify Telegram
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "⚠️ Telegram secrets not set, skipping."
          exit 0
        fi

        CHANGED_COUNT=$(git diff --name-only HEAD~1 2>/dev/null | grep 'files/' | wc -l || echo "1")
        TOTAL_FILES=$(node -e 'console.log(require("fs").readdirSync("files").filter(f => !f.startsWith(".")).length)')

        # 1. Отправляем первичное сообщение, что деплой запущен
        INIT_MSG="⏳ *Файлы загружены, деплой на GitHub Pages в процессе...*%0A📁 Изменено: $CHANGED_COUNT | Всего: $TOTAL_FILES"
        
        RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="$INIT_MSG" \
          -d parse_mode="Markdown")
        
        # Вытаскиваем ID отправленного сообщения, чтобы потом его отредактировать
        MSG_ID=$(echo "$RESPONSE" | node -e '
          let data = "";
          process.stdin.on("data", chunk => data += chunk);
          process.stdin.on("end", () => {
            try {
              const json = JSON.parse(data);
              if (json.ok) console.log(json.result.message_id);
            } catch(e) {}
          });
        ')

        echo "🔄 Ожидание деплоя на GitHub Pages для комита $COMMIT_SHA..."

        # 2. Цикл проверки статуса деплоя через GitHub API (максимум ждем ~10 минут: 60 попыток по 10 секунд)
        STATUS="queued"
        for i in {1..60}; do
          sleep 10
          
          # Получаем список деплоев для репозитория
          DEPLOYMENTS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/deployments?sha=$COMMIT_SHA")
          
          DEPLOY_ID=$(echo "$DEPLOYMENTS" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              try {
                const list = JSON.parse(data);
                if (Array.isArray(list) && list.length > 0) console.log(list[0].id);
              } catch(e) {}
            });
          ')

          if [ -n "$DEPLOY_ID" ]; then
            # Проверяем статус конкретного деплоя
            STATUSES=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/deployments/$DEPLOY_ID/statuses")
            
            STATUS=$(echo "$STATUSES" | node -e '
              let data = "";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                try {
                  const list = JSON.parse(data);
                  if (Array.isArray(list) && list.length > 0) console.log(list[0].state);
                } catch(e) {}
              });
            ')
            
            echo "Попытка $i: Статус деплоя -> ${STATUS:-queued}"
            
            if [ "$STATUS" = "success" ]; then
              break
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "error" ]; then
              break
            fi
          else
            echo "Попытка $i: Деплой еще не создан в API..."
          fi
        done

        # 3. Обновляем сообщение в Телеграме в зависимости от результата
        if [ "$STATUS" = "success" ]; then
          FINAL_MSG="✅ *Деплой успешно завершён!*%0A📁 Изменено файлов: $CHANGED_COUNT%0A📦 Всего в архиве: $TOTAL_FILES%0A🌐 [Открыть сайт](https://veniamin668.github.io/files.html)"
        else
          FINAL_MSG="❌ *Деплой завершился с ошибкой или тайм-аутом!*%0A📁 Изменено: $CHANGED_COUNT | Всего: $TOTAL_FILES"
        fi

        if [ -n "$MSG_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/editMessageText" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d message_id="$MSG_ID" \
            -d text="$FINAL_MSG" \
            -d parse_mode="Markdown" > /dev/null
        else
          # Если вдруг не удалось поймать ID сообщения, шлем новое
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$FINAL_MSG" \
            -d parse_mode="Markdown" > /dev/null
        fi
