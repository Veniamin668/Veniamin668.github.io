name: Auto Update File List with Metadata

on:
  push:
    paths:
      - 'files/**'
      - 'files.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg exiftool

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate File List with Metadata (Node.js)
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");
        const { execSync } = require("child_process");

        const folderPath = path.join(process.cwd(), "files");
        if (!fs.existsSync(folderPath)) {
          console.error("Папка files не найдена");
          process.exit(1);
        }

        function getFileType(ext) {
          const imageExts = [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".tiff", ".webp"];
          const videoExts = [".mp4", ".avi", ".mov", ".mkv", ".webm", ".flv", ".wmv"];
          const audioExts = [".mp3", ".wav", ".flac", ".aac", ".ogg", ".m4a"];
          const lower = ext.toLowerCase();
          if (imageExts.includes(lower)) return "image";
          if (videoExts.includes(lower)) return "video";
          if (audioExts.includes(lower)) return "audio";
          return "other";
        }

        function getImageMetadata(filePath) {
          try {
            const output = execSync(`exiftool -CreateDate -ImageWidth -ImageHeight -j "${filePath}"`, { encoding: "utf8" });
            const data = JSON.parse(output)[0];
            return {
              width: data.ImageWidth || null,
              height: data.ImageHeight || null,
              date: data.CreateDate || null
            };
          } catch (e) {
            return { width: null, height: null, date: null };
          }
        }

        function getMediaMetadata(filePath) {
          try {
            const output = execSync(`ffprobe -v quiet -print_format json -show_format -show_streams "${filePath}"`, { encoding: "utf8" });
            const data = JSON.parse(output);
            const format = data.format;
            const streams = data.streams;

            let duration = format.duration ? parseFloat(format.duration) : null;
            let bitrate = format.bit_rate ? parseInt(format.bit_rate) : null;
            let sampleRate = null;
            let width = null, height = null;
            let codec = null;

            for (const stream of streams) {
              if (stream.codec_type === "video") {
                width = stream.width || null;
                height = stream.height || null;
                codec = stream.codec_name || null;
              } else if (stream.codec_type === "audio") {
                sampleRate = stream.sample_rate ? parseInt(stream.sample_rate) : null;
                if (!codec) codec = stream.codec_name || null;
              }
            }

            return {
              duration: duration,
              bitrate: bitrate,
              sampleRate: sampleRate,
              width: width,
              height: height,
              codec: codec
            };
          } catch (e) {
            return { duration: null, bitrate: null, sampleRate: null, width: null, height: null, codec: null };
          }
        }

        const files = fs.readdirSync(folderPath).filter(f => !f.startsWith("."));
        files.sort((a, b) => a.localeCompare(b));

        const result = files.map(file => {
          const filePath = path.join(folderPath, file);
          const stats = fs.statSync(filePath);
          const bytes = stats.size;
          const ext = path.extname(file);
          const type = getFileType(ext);

          let sizeStr = "";
          if (bytes >= 1048576) {
            sizeStr = (bytes / 1048576).toFixed(1) + " МБ";
          } else {
            sizeStr = (bytes / 1024).toFixed(1) + " КБ";
          }

          let metadata = {};
          if (type === "image") {
            metadata = getImageMetadata(filePath);
          } else if (type === "video" || type === "audio") {
            metadata = getMediaMetadata(filePath);
          }

          return {
            name: file,
            size: sizeStr,
            type: type,
            metadata: metadata,
            modified: stats.mtime.toISOString()
          };
        });

        // Сохраняем статистику в stats.json (для будущего использования)
        const stats = {
          totalFiles: result.length,
          totalSize: result.reduce((acc, f) => acc + parseFloat(f.size) * (f.size.includes("МБ") ? 1048576 : 1024), 0),
          lastUpdated: new Date().toISOString(),
          types: {}
        };
        result.forEach(f => {
          const t = f.type || "other";
          stats.types[t] = (stats.types[t] || 0) + 1;
        });
        fs.writeFileSync("stats.json", JSON.stringify(stats, null, 2));

        // Вставляем массив в files.html
        const jsonStr = JSON.stringify(result, null, 2);
        const htmlPath = path.join(process.cwd(), "files.html");
        let htmlContent = fs.readFileSync(htmlPath, "utf8");
        htmlContent = htmlContent.replace(
          /const fileData = \[\s*([\s\S]*?)\s*\];/,
          `const fileData = ${jsonStr};`
        );
        fs.writeFileSync(htmlPath, htmlContent, "utf8");
        console.log("✅ files.html обновлён с метаданными!");
        '

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add files.html stats.json
        git commit --allow-empty -m "chore: auto-update file list with metadata [skip ci]" || true
        git pull --rebase origin main || true
        git push origin main || true

    # ===== НОВЫЙ ШАГ: УВЕДОМЛЕНИЕ В TELEGRAM =====
    - name: Send Ultimate Notification (Node.js)
      if: success()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        REPO: ${{ github.repository }}
      run: |
        cat << 'EOF' > notify.js
        const fs = require('fs');
        const path = require('path');
        const { execSync } = require('child_process');

        // 1. Проверяем доступы
        if (!process.env.TELEGRAM_TOKEN || !process.env.TELEGRAM_CHAT_ID) {
          console.log("⚠️ Токены Telegram не найдены, пропускаем отправку.");
          process.exit(0);
        }

        // 2. Сбор статистики по файлам
        const folderPath = path.join(process.cwd(), 'files');
        let images = 0, videos = 0, audios = 0, others = 0, totalBytes = 0, totalFiles = 0;

        if (fs.existsSync(folderPath)) {
          const files = fs.readdirSync(folderPath).filter(f => !f.startsWith('.'));
          totalFiles = files.length;
          files.forEach(file => {
            totalBytes += fs.statSync(path.join(folderPath, file)).size;
            const ext = path.extname(file).toLowerCase();
            if (['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp'].includes(ext)) images++;
            else if (['.mp4', '.mkv', '.avi', '.mov', '.webm'].includes(ext)) videos++;
            else if (['.mp3', '.wav', '.flac', '.ogg', '.m4a'].includes(ext)) audios++;
            else others++;
          });
        }

        const formatSize = (bytes) => {
          if (bytes < 1024) return bytes + ' Б';
          if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' КБ';
          if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' МБ';
          return (bytes / 1073741824).toFixed(2) + ' ГБ';
        };

        // 3. Безопасное получение данных из Git (не крашит воркфлоу при ошибке)
        let changedCount = totalFiles;
        try {
          const diff = execSync('git diff --name-only HEAD~1 2>/dev/null').toString();
          const count = diff.split('\n').filter(f => f.startsWith('files/')).length;
          if (count > 0) changedCount = count;
        } catch(e) {}

        let commits = '• <code>HEAD</code> Обновление репозитория';
        try {
          commits = execSync('git log -n 3 --pretty=format:"• <code>%h</code> %s"').toString().trim();
        } catch(e) {}

        // 4. Формирование динамической ссылки
        const repo = process.env.REPO || 'user/repo';
        const [owner, project] = repo.split('/');
        const siteUrl = project === `${owner}.github.io` 
          ? `https://${owner}.github.io/files` 
          : `https://${owner}.github.io/${project}/files`;

        // 5. Формирование URL для графика (Deep Dark Theme)
        const chartConfig = {
          type: 'doughnut',
          data: {
            labels: ['Картинки', 'Видео', 'Аудио', 'Прочее'],
            datasets: [{
              data: [images, videos, audios, others],
              backgroundColor: ['#38bdf8', '#f43f5e', '#a855f7', '#eab308'],
              borderColor: '#111111',
              borderWidth: 3
            }]
          },
          options: {
            plugins: {
              legend: { position: 'bottom', labels: { color: '#e2e8f0', font: { size: 14 } } },
              title: { display: true, text: 'СТРУКТУРА АРХИВА', color: '#f8fafc', font: { size: 16, weight: 'bold' } }
            }
          }
        };
        const chartUrl = `https://quickchart.io/chart?w=600&h=480&bkg=111111&c=${encodeURIComponent(JSON.stringify(chartConfig))}`;

        // 6. Текст сообщения
        const caption = `<b>✨ Архив файлов успешно обновлён!</b>\n\n📦 Всего файлов: <code>${totalFiles}</code> (Вес: <code>${formatSize(totalBytes)}</code>)\n📁 Изменено: <code>${changedCount}</code>\n\n📜 <b>Последние коммиты:</b>\n${commits}\n\n🌐 <a href="${siteUrl}">Открыть файлы</a>`;

        // 7. Отправка через нативный fetch (Telegram умеет сам скачивать фото по ссылке)
        fetch(`https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendPhoto`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: process.env.TELEGRAM_CHAT_ID,
            photo: chartUrl,
            caption: caption,
            parse_mode: 'HTML'
          })
        })
        .then(res => res.json())
        .then(data => {
          if (!data.ok) console.error("Ошибка Telegram API:", data);
          else console.log("✅ Уведомление успешно отправлено!");
        })
        .catch(err => console.error("Network error:", err));
        EOF
        
        node notify.js
