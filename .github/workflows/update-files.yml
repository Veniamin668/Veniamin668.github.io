name: Auto Update File List with Metadata

on:
  push:
    paths:
      - 'files/**'
      - 'files.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg exiftool

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate File List with Metadata (Node.js)
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");
        const { execSync } = require("child_process");

        const folderPath = path.join(process.cwd(), "files");
        if (!fs.existsSync(folderPath)) {
          console.error("Папка files не найдена");
          process.exit(1);
        }

        function getFileType(ext) {
          const imageExts = [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".tiff", ".webp"];
          const videoExts = [".mp4", ".avi", ".mov", ".mkv", ".webm", ".flv", ".wmv"];
          const audioExts = [".mp3", ".wav", ".flac", ".aac", ".ogg", ".m4a"];
          const lower = ext.toLowerCase();
          if (imageExts.includes(lower)) return "image";
          if (videoExts.includes(lower)) return "video";
          if (audioExts.includes(lower)) return "audio";
          return "other";
        }

        function getImageMetadata(filePath) {
          try {
            const output = execSync(`exiftool -CreateDate -ImageWidth -ImageHeight -j "${filePath}"`, { encoding: "utf8" });
            const data = JSON.parse(output)[0];
            return {
              width: data.ImageWidth || null,
              height: data.ImageHeight || null,
              date: data.CreateDate || null
            };
          } catch (e) {
            return { width: null, height: null, date: null };
          }
        }

        function getMediaMetadata(filePath) {
          try {
            const output = execSync(`ffprobe -v quiet -print_format json -show_format -show_streams "${filePath}"`, { encoding: "utf8" });
            const data = JSON.parse(output);
            const format = data.format;
            const streams = data.streams;

            let duration = format.duration ? parseFloat(format.duration) : null;
            let bitrate = format.bit_rate ? parseInt(format.bit_rate) : null;
            let sampleRate = null;
            let width = null, height = null;
            let codec = null;

            for (const stream of streams) {
              if (stream.codec_type === "video") {
                width = stream.width || null;
                height = stream.height || null;
                codec = stream.codec_name || null;
              } else if (stream.codec_type === "audio") {
                sampleRate = stream.sample_rate ? parseInt(stream.sample_rate) : null;
                if (!codec) codec = stream.codec_name || null;
              }
            }

            return {
              duration: duration,
              bitrate: bitrate,
              sampleRate: sampleRate,
              width: width,
              height: height,
              codec: codec
            };
          } catch (e) {
            return { duration: null, bitrate: null, sampleRate: null, width: null, height: null, codec: null };
          }
        }

        const files = fs.readdirSync(folderPath).filter(f => !f.startsWith("."));
        files.sort((a, b) => a.localeCompare(b));

        const result = files.map(file => {
          const filePath = path.join(folderPath, file);
          const stats = fs.statSync(filePath);
          const bytes = stats.size;
          const ext = path.extname(file);
          const type = getFileType(ext);

          let sizeStr = "";
          if (bytes >= 1048576) {
            sizeStr = (bytes / 1048576).toFixed(1) + " МБ";
          } else {
            sizeStr = (bytes / 1024).toFixed(1) + " КБ";
          }

          let metadata = {};
          if (type === "image") {
            metadata = getImageMetadata(filePath);
          } else if (type === "video" || type === "audio") {
            metadata = getMediaMetadata(filePath);
          }

          return {
            name: file,
            size: sizeStr,
            type: type,
            metadata: metadata,
            modified: stats.mtime.toISOString()
          };
        });

        // Сохраняем статистику в stats.json (для будущего использования)
        const stats = {
          totalFiles: result.length,
          totalSize: result.reduce((acc, f) => acc + parseFloat(f.size) * (f.size.includes("МБ") ? 1048576 : 1024), 0),
          lastUpdated: new Date().toISOString(),
          types: {}
        };
        result.forEach(f => {
          const t = f.type || "other";
          stats.types[t] = (stats.types[t] || 0) + 1;
        });
        fs.writeFileSync("stats.json", JSON.stringify(stats, null, 2));

        // Вставляем массив в files.html
        const jsonStr = JSON.stringify(result, null, 2);
        const htmlPath = path.join(process.cwd(), "files.html");
        let htmlContent = fs.readFileSync(htmlPath, "utf8");
        htmlContent = htmlContent.replace(
          /const fileData = \[\s*([\s\S]*?)\s*\];/,
          `const fileData = ${jsonStr};`
        );
        fs.writeFileSync(htmlPath, htmlContent, "utf8");
        console.log("✅ files.html обновлён с метаданными!");
        '

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add files.html stats.json
        git commit --allow-empty -m "chore: auto-update file list with metadata [skip ci]" || true
        git pull --rebase origin main || true
        git push origin main || true

    # ===== НОВЫЙ ШАГ: УВЕДОМЛЕНИЕ В TELEGRAM =====
    - name: Send Dark Chart & Notification to Telegram
      shell: bash
      env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
      run: |
          # 1. Собираем статистику по папке files через Node.js
          STATS_JSON=$(node -e '
            const fs = require("fs");
            const path = require("path");
            const folderPath = path.join(process.cwd(), "files");
            if (!fs.existsSync(folderPath)) {
              console.log(JSON.stringify({ totalSize: "0 Б", images: 0, videos: 0, audios: 0, others: 0, total: 0 }));
              process.exit(0);
            }
            const files = fs.readdirSync(folderPath).filter(f => !f.startsWith("."));
            let totalBytes = 0;
            let images = 0, videos = 0, audios = 0, others = 0;
            files.forEach(file => {
              const stat = fs.statSync(path.join(folderPath, file));
              totalBytes += stat.size;
              const ext = path.extname(file).toLowerCase();
              if ([".jpg", ".jpeg", ".png", ".gif", ".webp", ".bmp"].includes(ext)) images++;
              else if ([".mp4", ".mkv", ".avi", ".mov", ".webm"].includes(ext)) videos++;
              else if ([".mp3", ".wav", ".flac", ".ogg", ".m4a"].includes(ext)) audios++;
              else others++;
            });
            let sizeStr = "";
            if (totalBytes < 1024) sizeStr = totalBytes + " Б";
            else if (totalBytes < 1048576) sizeStr = (totalBytes / 1024).toFixed(1) + " КБ";
            else if (totalBytes < 1073741824) sizeStr = (totalBytes / 1048576).toFixed(1) + " МБ";
            else sizeStr = (totalBytes / 1073741824).toFixed(2) + " ГБ";
            console.log(JSON.stringify({ totalSize: sizeStr, images, videos, audios, others, total: files.length }));
          ')

          TOTAL_SIZE=$(echo "$STATS_JSON" | node -e 'console.log(JSON.parse(fs.readFileSync(0, "utf8")).totalSize)')
          TOTAL_FILES=$(echo "$STATS_JSON" | node -e 'console.log(JSON.parse(fs.readFileSync(0, "utf8")).total)')
          IMG_COUNT=$(echo "$STATS_JSON" | node -e 'console.log(JSON.parse(fs.readFileSync(0, "utf8")).images)')
          VID_COUNT=$(echo "$STATS_JSON" | node -e 'console.log(JSON.parse(fs.readFileSync(0, "utf8")).videos)')
          AUD_COUNT=$(echo "$STATS_JSON" | node -e 'console.log(JSON.parse(fs.readFileSync(0, "utf8")).audios)')
          OTH_COUNT=$(echo "$STATS_JSON" | node -e 'console.log(JSON.parse(fs.readFileSync(0, "utf8")).others)')

          # Безопасный подсчет измененных файлов (не падает на первом коммите)
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED_COUNT=$(git diff --name-only HEAD~1 2>/dev/null | grep -E '^files/' | wc -l || echo "1")
          else
            CHANGED_COUNT="$TOTAL_FILES"
          fi
          [ -z "$CHANGED_COUNT" ] && CHANGED_COUNT="1"

          # Получаем коммиты без лишних спецсимволов для HTML
          COMMITS_LOG=$(git log -n 3 --pretty=format:"• <code>%h</code> %s" 2>/dev/null || echo "• <code>HEAD</code> Обновление репозитория")

          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          PROJECT=$(echo "$REPO" | cut -d'/' -f2)

          if [ "$PROJECT" = "$OWNER.github.io" ]; then
              SITE_URL="https://$OWNER.github.io/files"
          else
              SITE_URL="https://$OWNER.github.io/$PROJECT/files"
          fi

          # 2. Настройка графика в темной стилистике (Deep Dark Theme)
          CHART_CONFIG='{
              "type": "doughnut",
              "data": {
                "labels": ["Картинки", "Видео", "Аудио", "Прочее"],
                "datasets": [{
                  "data": ['$IMG_COUNT', '$VID_COUNT', '$AUD_COUNT', '$OTH_COUNT'],
                  "backgroundColor": ["#38bdf8", "#f43f5e", "#a855f7", "#eab308"],
                  "borderColor": "#111111",
                  "borderWidth": 3
                }]
              },
              "options": {
                "plugins": {
                  "legend": { 
                    "position": "bottom", 
                    "labels": { 
                      "color": "#e2e8f0", 
                      "font": { "size": 14, "family": "sans-serif" },
                      "padding": 20
                    } 
                  },
                  "title": { 
                    "display": true, 
                    "text": "СТРУКТУРА АРХИВА ФАЙЛОВ", 
                    "color": "#f8fafc",
                    "font": { "size": 16, "weight": "bold" },
                    "padding": 20
                  }
                }
              }
          }'

          # Генерируем картинку графиков
          curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"chart\": $(echo "$CHART_CONFIG" | tr -d '\n'), \"width\": 600, \"height\": 480, \"backgroundColor\": \"#111111\"}" \
              "https://quickchart.io/chart" --output chart.png

          # 3. Формируем чистый HTML-текст
          read -r -d '' CAPTION << EOM || true
          <b>✨ Архив файлов успешно обновлён!</b>

          📦 Всего файлов: <code>$TOTAL_FILES</code> (Вес: <code>$TOTAL_SIZE</code>)
          📁 Изменено в коммите: <code>$CHANGED_COUNT</code>

          📜 <b>Последние коммиты:</b>
          $COMMITS_LOG

          🌐 <a href="$SITE_URL">Открыть файлы</a>
          EOM

          # 4. Отправляем в Telegram
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F photo=@chart.png \
              -F caption="$CAPTION" \
              -F parse_mode="HTML"
