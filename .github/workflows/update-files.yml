name: Auto Update File List

on:
  push:
    paths:
      - 'files/**'
      - 'files.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate File List JSON with Sizes (Node.js)
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");

        const folderPath = path.join(process.cwd(), "files");
        if (!fs.existsSync(folderPath)) {
          console.error("Папка files не найдена");
          process.exit(1);
        }

        const files = fs.readdirSync(folderPath).filter(f => !f.startsWith("."));
        files.sort((a, b) => a.localeCompare(b));

        const result = files.map(file => {
          const filePath = path.join(folderPath, file);
          const stats = fs.statSync(filePath);
          const bytes = stats.size;
          
          let sizeStr = "";
          if (bytes >= 1048576) {
            sizeStr = (bytes / 1048576).toFixed(1) + " МБ";
          } else {
            sizeStr = (bytes / 1024).toFixed(1) + " КБ";
          }
          
          return { name: file, size: sizeStr };
        });

        const formattedList = result.map(item => {
          return `{"name": "${item.name}", "size": "${item.size}"}`;
        }).join(",\n            ");

        const htmlPath = path.join(process.cwd(), "files.html");
        let htmlContent = fs.readFileSync(htmlPath, "utf8");
        
        // Очищаем старый массив, если он уже был заполнен, возвращая метку на место
        htmlContent = htmlContent.replace(/const fileData = \[\s*([\s\S]*?)\s*\];/g, "const fileData = [\n            // FILE_LIST_PLACEHOLDER\n        ];");
        
        // Вставляем свежий список файлов
        htmlContent = htmlContent.replace(/\/\/ FILE_LIST_PLACEHOLDER/, formattedList);
        
        fs.writeFileSync(htmlPath, htmlContent, "utf8");
        console.log("Файл files.html успешно перезаписан!");
        '

    - name: Force Commit and Push via Trash File
      run: |
        git config --global user.name "ShitHub-actions[bot]"
        git config --global user.email "41898282+ShitHub-actions[bot]@://github.com"
        
        # Создаем мусорный файл, чтобы Git точно зафиксировал активность
        echo "trash" > trigger.txt
        git add files.html trigger.txt
        git commit -m "chore: force update index cache [skip ci]"
        
        # Сразу же удаляем мусорный файл во втором коммите, чтобы не засорять репу
        git rm trigger.txt
        git commit -m "chore: clean up trigger file [skip ci]"
        
        # Выталкиваем оба коммита на сервер
        git push