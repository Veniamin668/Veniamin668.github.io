name: Auto Update File List

on:
  push:
    paths:
      - 'files/**'
      - 'files.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate File List and Manage Folders
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");

        const folderPath = path.join(process.cwd(), "files");
        const baseHtmlPath = path.join(process.cwd(), "files.html");
        const baseHtmlContent = fs.readFileSync(baseHtmlPath, "utf8");

        if (!fs.existsSync(folderPath)) {
          console.error("Папка files не найдена");
          process.exit(1);
        }

        // Функция для форматирования размера
        function formatSize(bytes) {
          if (bytes >= 1048576) {
            return (bytes / 1048576).toFixed(1) + " МБ";
          } else {
            return (bytes / 1024).toFixed(1) + " КБ";
          }
        }

        // Функция для получения только файлов (не папок)
        function getFilesInFolder(folderPath) {
          const items = fs.readdirSync(folderPath).filter(f => !f.startsWith("."));
          items.sort((a, b) => a.localeCompare(b));
          
          const files = [];
          items.forEach(item => {
            const itemPath = path.join(folderPath, item);
            const stats = fs.statSync(itemPath);
            
            if (!stats.isDirectory()) {
              files.push({
                name: item,
                size: formatSize(stats.size),
                type: "file"
              });
            }
          });
          return files;
        }

        // Функция для получения папок
        function getFoldersInFolder(folderPath) {
          const items = fs.readdirSync(folderPath).filter(f => !f.startsWith("."));
          items.sort((a, b) => a.localeCompare(b));
          
          const folders = [];
          items.forEach(item => {
            const itemPath = path.join(folderPath, item);
            const stats = fs.statSync(itemPath);
            
            if (stats.isDirectory()) {
              folders.push({
                name: item,
                type: "folder"
              });
            }
          });
          return folders;
        }

        // Функция для генерации JSON строки с файлами и папками
        function generateFileDataJson(files, folders) {
          const all = [...folders, ...files];
          return all.map(item => {
            if (item.type === "folder") {
              return `{"name": "${item.name}", "size": "-", "type": "folder"}`;
            } else {
              return `{"name": "${item.name}", "size": "${item.size}", "type": "file"}`;
            }
          }).join(",\\n            ");
        }

        // Функция для генерации JSON строки только с файлами (для подпапок)
        function generateFileDataJsonFilesOnly(files) {
          return files.map(item => {
            return `{"name": "${item.name}", "size": "${item.size}", "type": "file"}`;
          }).join(",\\n            ");
        }

        // Функция для обновления HTML файла
        function updateHtmlFile(htmlPath, fileDataJson, folderName = null) {
          let htmlContent = baseHtmlContent;
          
          // Если это подпапка, обновляем заголовок и URL
          if (folderName) {
            htmlContent = htmlContent.replace(
              /<h1>Архив компонентов<\/h1>/,
              `<h1>${folderName}</h1>`
            );
            htmlContent = htmlContent.replace(
              /const BASE_URL = .*/,
              `const BASE_URL = '\''https://veniamin668.github.io/files/${folderName}/'\''`
            );
          }

          htmlContent = htmlContent.replace(
            /const fileData = \[([\s\S]*?)\];/,
            `const fileData = [\\n            ${fileDataJson}\\n        ];`
          );

          fs.writeFileSync(htmlPath, htmlContent, "utf8");
        }

        // 1. Обновляем главный files.html (с папками и файлами)
        const rootFiles = getFilesInFolder(folderPath);
        const rootFolders = getFoldersInFolder(folderPath);
        const rootFileDataJson = generateFileDataJson(rootFiles, rootFolders);
        updateHtmlFile(baseHtmlPath, rootFileDataJson, null);
        console.log("✓ Обновлен главный files.html с папками и файлами");

        // 2. Обрабатываем каждую подпапку
        rootFolders.forEach(folder => {
          const subFolderPath = path.join(folderPath, folder.name);
          const htmlFileName = folder.name + ".html";
          const htmlFilePath = path.join(subFolderPath, htmlFileName);

          const subFiles = getFilesInFolder(subFolderPath);
          const subFileDataJson = generateFileDataJsonFilesOnly(subFiles);

          // Если файл не существует, создаем его
          if (!fs.existsSync(htmlFilePath)) {
            updateHtmlFile(htmlFilePath, subFileDataJson, folder.name);
            console.log(`✓ Создан новый ${htmlFileName}`);
          } else {
            // Если файл существует, обновляем данные о файлах
            updateHtmlFile(htmlFilePath, subFileDataJson, folder.name);
            console.log(`✓ Обновлен ${htmlFileName}`);
          }
        });

        console.log("Все файлы успешно обновлены!");
        '

    - name: Commit and Push Changes
      run: |
        git config --global user.name "ShitHub-actions[bot]"
        git config --global user.email "41898282+ShitHub-actions[bot]@://github.com"
        
        # Проверяем, есть ли изменения
        if [ -z "$(git status --porcelain)" ]; then
          echo "Нет изменений для коммита"
          exit 0
        fi
        
        git add files.html
        git add files/ -A
        git commit -m "chore: auto-update file lists [skip ci]"
        git push
