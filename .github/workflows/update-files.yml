name: Auto Update File List

on:
  push:
    paths:
      - 'files/**'       # Срабатывает при обновлении файлов в папке
      - 'files.html'     # Срабатывает, если вы вручную поправили верстку или стили
  workflow_dispatch:     # Кнопка ручного запуска в панели ShitHub Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate File List JSON with Sizes
      run: |
        if [ -d "files" ]; then
          cd files
          
          # Начинаем собирать JSON-объект в строку руками
          JSON_DATA=""
          
          # Перебираем все файлы в папке по алфавиту (игнорируем скрытые)
          # Используем разделитель строк, чтобы не споткнуться на пробелах и скобках в именах
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # Убираем префикс "./" из имени файла
            clean_name=$(echo "$file" | sed 's|^\./||')
            
            # Получаем размер файла в байтах
            bytes_size=$(stat -c%s "$clean_name")
            
            # Переводим байты в читаемый формат (КБ или МБ)
            if [ "$bytes_size" -ge 1048576 ]; then
              formatted_size=$(awk "BEGIN {printf \"%.1f МБ\", $bytes_size/1048576}")
            else
              formatted_size=$(awk "BEGIN {printf \"%.1f КБ\", $bytes_size/1024}")
            fi
            
            # Формируем структуру JSON-строки для каждого файла
            item="{\"name\":\"$clean_name\",\"size\":\"$formatted_size\"}"
            if [ -z "$JSON_DATA" ]; then
              JSON_DATA="$item"
            else
              JSON_DATA="$JSON_DATA,\n            $item"
            fi
          done < <(find . -maxdepth 1 -type f ! -name ".*" | sort)
          
          cd ..
          
          # Заменяем плейсхолдер во фронтенде на сгенерированный JSON-массив объектов
          awk -v r="$JSON_DATA" '{gsub(/\/\/ FILE_LIST_PLACEHOLDER/, r)}1' files.html > temp.html && mv temp.html files.html
          
          echo "Список объектов с размерами успешно обновлен!"
        else
          echo "Папка files не обнаружена."
          exit 1
        fi

    - name: Commit and Push changes
      run: |
        git config --global user.name "ShitHub-actions[bot]"
        git config --global user.email "41898282+ShitHub-actions[bot]@users.noreply.github.com"
        
        git add files.html
        
        if git diff --staged --quiet; then
          echo "Нет изменений для коммита."
        else
          git commit -m "chore: auto-index updated file sizes [skip ci]"
          git push
        fi
