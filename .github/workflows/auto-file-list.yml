name: Auto Update File List

on:
  push:
    paths:
      - 'files/**'
      - 'files.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate File List and Manage Folders
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");

        const folderPath = path.join(process.cwd(), "files");
        const baseHtmlPath = path.join(process.cwd(), "files.html");
        const baseHtmlContent = fs.readFileSync(baseHtmlPath, "utf8");

        if (!fs.existsSync(folderPath)) {
          console.error("Папка files не найдена");
          process.exit(1);
        }

        // Функция для форматирования размера
        function formatSize(bytes) {
          if (bytes >= 1048576) {
            return (bytes / 1048576).toFixed(1) + " МБ";
          } else {
            return (bytes / 1024).toFixed(1) + " КБ";
          }
        }

        // Функция для получения элементов в папке
        function getItemsInFolder(folderPath) {
          const items = fs.readdirSync(folderPath).filter(f => !f.startsWith("."));
          items.sort((a, b) => a.localeCompare(b));
          
          const result = {
            files: [],
            folders: []
          };

          items.forEach(item => {
            const itemPath = path.join(folderPath, item);
            const stats = fs.statSync(itemPath);
            
            if (stats.isDirectory()) {
              result.folders.push({
                name: item,
                type: "folder"
              });
            } else {
              result.files.push({
                name: item,
                size: formatSize(stats.size),
                type: "file"
              });
            }
          });

          return result;
        }

        // Функция для генерации JSON строки
        function generateFileDataJson(items) {
          const all = [...items.folders, ...items.files];
          return all.map(item => {
            if (item.type === "folder") {
              return `{"name": "${item.name}", "size": "-", "type": "folder"}`;
            } else {
              return `{"name": "${item.name}", "size": "${item.size}", "type": "file"}`;
            }
          }).join(",\n            ");
        }

        // Функция для обновления HTML файла с данными
        function updateHtmlFile(htmlPath, items, folderName) {
          let htmlContent = baseHtmlContent;
          
          // Обновляем заголовок если это подпапка
          if (folderName) {
            htmlContent = htmlContent.replace(
              /<h1>Архив компонентов<\/h1>/,
              `<h1>${folderName}</h1>`
            );
            
            // Обновляем базовый URL
            const folderUrl = folderName.toLowerCase().replace(/\s+/g, "_");
            htmlContent = htmlContent.replace(
              /const BASE_URL = .*/,
              `const BASE_URL = '\''https://veniamin668.github.io/files/${folderUrl}/'\''`
            );
          }

          const fileDataJson = generateFileDataJson(items);
          htmlContent = htmlContent.replace(
            /const fileData = \[\s*([\s\S]*?)\s*\];/,
            `const fileData = [\n            ${fileDataJson}\n        ];`
          );

          fs.writeFileSync(htmlPath, htmlContent, "utf8");
        }

        // 1. Обновляем главный files.html (корневую папку files)
        const rootItems = getItemsInFolder(folderPath);
        updateHtmlFile(baseHtmlPath, rootItems, null);
        console.log("✓ Обновлен главный files.html");

        // 2. Обрабатываем каждую подпапку
        rootItems.folders.forEach(folder => {
          const subFolderPath = path.join(folderPath, folder.name);
          const htmlFileName = folder.name + ".html";
          const htmlFilePath = path.join(subFolderPath, htmlFileName);

          // Если файл не существует, создаем его
          if (!fs.existsSync(htmlFilePath)) {
            const subItems = getItemsInFolder(subFolderPath);
            updateHtmlFile(htmlFilePath, subItems, folder.name);
            console.log(`✓ Создан новый ${htmlFileName}`);
          } else {
            // Если файл существует, просто обновляем данные
            const subItems = getItemsInFolder(subFolderPath);
            updateHtmlFile(htmlFilePath, subItems, folder.name);
            console.log(`✓ Обновлен ${htmlFileName}`);
          }
        });

        console.log("Все файлы успешно обновлены!");
        '

    - name: Force Commit and Push via Trash File
      run: |
        git config --global user.name "ShitHub-actions[bot]"
        git config --global user.email "41898282+ShitHub-actions[bot]@://github.com"
        
        # Проверяем, есть ли изменения
        if [ -z "$(git status --porcelain)" ]; then
          echo "Нет изменений для коммита"
          exit 0
        fi
        
        # Создаем мусорный файл, чтобы Git точно зафиксировал активность
        echo "trash" > trigger.txt
        git add files.html files/**/*.html trigger.txt
        git commit -m "chore: auto-update file lists [skip ci]"
        
        # Сразу же удаляем мусорный файл во втором коммите, чтобы не засорять репу
        git rm trigger.txt
        git commit -m "chore: clean up trigger file [skip ci]" || true
        
        # Выталкиваем коммиты на сервер
        git push
