name: Auto Update Wiki

on:
  push:
    paths:
      - 'md-wiki/**'
      - '.github/workflows/update-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Quartz 4 Obsidian Wiki
        run: |
          mkdir -p md-wiki

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          if [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            BASE_URL="${REPO_OWNER}.github.io/public/wiki"
            SITE_URL="https://${REPO_OWNER}.github.io/wiki"
          else
            BASE_URL="${REPO_OWNER}.github.io/${REPO_NAME}/public/wiki"
            SITE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/wiki"
          fi

          echo "WIKI_URL=$SITE_URL" >> $GITHUB_ENV

          # Клонируем Quartz
          rm -rf .quartz
          git clone --depth 1 https://github.com/jackyzha0/quartz.git .quartz
          cd .quartz
          npm ci

          # Пропатчим конфиг Quartz
          node -e "
            const fs = require('fs');
            let targetFile = fs.existsSync('quartz.config.ts') ? 'quartz.config.ts' : 'quartz.config.default.yaml';
            if (fs.existsSync('quartz.config.default.yaml') && !fs.existsSync('quartz.config.yaml')) {
              fs.copyFileSync('quartz.config.default.yaml', 'quartz.config.yaml');
              targetFile = 'quartz.config.yaml';
            }
            let cfg = fs.readFileSync(targetFile, 'utf8');
            cfg = cfg.replace(/pageTitle:.*$/m, 'pageTitle: \"🧠 Obsidian Wiki\"');
            cfg = cfg.replace(/baseUrl:.*$/m, 'baseUrl: \"$BASE_URL\"');
            fs.writeFileSync(targetFile, cfg, 'utf8');
          "

          # Копируем сырые заметки из md-wiki/
          cp -r ../md-wiki/* content/ 2>/dev/null || true

          if [ ! -f content/index.md ]; then
            echo "# 🧠 ktoya? Wiki" > content/index.md
            echo "Добро пожаловать в базу знаний!" >> content/index.md
          fi

          # Копируем твой custom.scss из корня репы в нужную директорию Quartz 5
          if [ -f "../custom.scss" ]; then
            cp ../custom.scss quartz/styles/custom.scss
            echo "✅ custom.scss успешно подтянут в Quartz 5!"
          fi
          
          # Сборка Quartz прямо в public/wiki
          npx quartz build -o ../public/wiki
          cd ..

          # Генерируем корневой wiki.html с полноэкранным iframe
          cat << 'EOF' > wiki.html
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Obsidian Wiki</title>
            <style>
              html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: #161618;
              }
              iframe {
                width: 100%;
                height: 100%;
                border: none;
                display: block;
              }
            </style>
          </head>
          <body>
            <iframe src="./public/wiki/index.html"></iframe>
          </body>
          </html>
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/wiki/ wiki.html md-wiki/

          if git diff --staged --quiet; then
            echo "Никаких изменений не обнаружено, пропускаем коммит."
          else
            git commit -m "chore: build Quartz from md-wiki/ to public/wiki [skip ci]"
            git push
          fi

      - name: Send Telegram Push Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WIKI_URL: ${{ env.WIKI_URL }}
        run: |
          if [ -f "notify-wiki.js" ]; then
            node notify-wiki.js
          fi
