name: Auto Update Wiki

on:
  push:
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Quartz 4 Obsidian Wiki
        id: quartz
        run: |
          mkdir -p wiki

          # Динамически определяем юзернейм и название репозитория
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          if [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            BASE_URL="${REPO_OWNER}.github.io/wiki"
            SITE_URL="https://${REPO_OWNER}.github.io/wiki"
          else
            BASE_URL="${REPO_OWNER}.github.io/${REPO_NAME}/wiki"
            SITE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/wiki"
          fi

          echo "WIKI_URL=$SITE_URL" >> $GITHUB_ENV

          # Клонируем Quartz
          rm -rf .quartz
          git clone --depth 1 https://github.com/jackyzha0/quartz.git .quartz
          cd .quartz
          npm ci

          # Универсальный патч конфига (поддерживает и .yaml, и .ts)
          node -e "
            const fs = require('fs');
            
            let targetFile = '';
            if (fs.existsSync('quartz.config.ts')) {
              targetFile = 'quartz.config.ts';
            } else if (fs.existsSync('quartz.config.default.yaml')) {
              fs.copyFileSync('quartz.config.default.yaml', 'quartz.config.yaml');
              targetFile = 'quartz.config.yaml';
            } else if (fs.existsSync('quartz.config.yaml')) {
              targetFile = 'quartz.config.yaml';
            }

            if (targetFile) {
              let cfg = fs.readFileSync(targetFile, 'utf8');
              cfg = cfg.replace(/pageTitle:.*$/m, 'pageTitle: \"🧠 Obsidian Wiki\"');
              cfg = cfg.replace(/baseUrl:.*$/m, 'baseUrl: \"$BASE_URL\"');
              
              // Если конфиг в дефолтном файле
              if (fs.existsSync('quartz.config.default.yaml')) {
                let defCfg = fs.readFileSync('quartz.config.default.yaml', 'utf8');
                defCfg = defCfg.replace(/pageTitle:.*$/m, 'pageTitle: \"🧠 Obsidian Wiki\"');
                defCfg = defCfg.replace(/baseUrl:.*$/m, 'baseUrl: \"$BASE_URL\"');
                fs.writeFileSync('quartz.config.default.yaml', defCfg, 'utf8');
              }

              fs.writeFileSync(targetFile, cfg, 'utf8');
              console.log('✅ Конфиг успешно пропатчен в:', targetFile);
            } else {
              console.error('❌ Ни один файл конфигурации Quartz не найден');
              process.exit(1);
            }
          "

          # Копируем заметки
          cp -r ../wiki/* content/ 2>/dev/null || true

          if [ ! -f content/index.md ]; then
            echo "# 🧠 Obsidian Wiki" > content/index.md
            echo "Добро пожаловать в базу знаний!" >> content/index.md
          fi

          # Сборка
          npx quartz build -o ../dist_wiki
          cd ..

          # Перенос готовой статики
          mkdir -p public/wiki
          rm -rf public/wiki/*
          cp -r dist_wiki/* public/wiki/

          # Редирект
          echo "<!DOCTYPE html><html><head><meta http-equiv=\"refresh\" content=\"0; url=$SITE_URL\"></head></html>" > wiki.html
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/wiki/ wiki.html wiki/
          if git diff --staged --quiet; then
            echo "Никаких изменений в wiki не обнаружено, пропускаем коммит."
          else
            git commit -m "chore: auto-build Quartz 4 wiki [skip ci]"
            git push
          fi

      - name: Send Telegram Push Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WIKI_URL: ${{ env.WIKI_URL }}
        run: |
          if [ -f "notify-wiki.js" ]; then
            node notify-wiki.js
          fi
