<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Билдер Кинотеатра</title>
    <style>
        body {
            font-family: system-ui, sans-serif; margin: 0; padding: 20px;
            background-color: #0f172a; color: #f1f5f9; display: flex; flex-direction: column; align-items: center;
        }
        .wrap { width: 100%; max-width: 500px; }
        h1 { text-align: center; margin: 0 0 10px; font-size: 1.8rem; }
        .subtitle { text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 25px; }
        .card { background: #1e293b; padding: 20px; border: 1px solid #334155; border-radius: 12px; text-align: center; }
        img { width: 100%; max-width: 150px; border-radius: 8px; margin-bottom: 10px; }
        .title { font-weight: 600; font-size: 1.2rem; margin-bottom: 5px; }
        .desc { font-size: .85rem; color: #94a3b8; text-align: left; max-height: 100px; overflow-y: auto; margin-bottom: 20px; }
        
        /* Кнопки генерации */
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .watch-btn {
            background: #2563eb; color: #fff; text-decoration: none; padding: 12px; 
            border-radius: 8px; font-weight: 600; font-size: 0.95rem; transition: background 0.1s;
        }
        .watch-btn:hover { background: #1d4ed8; }
        .watch-btn.secondary { background: #475569; }
        .watch-btn.secondary:hover { background: #334155; }

        .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 25px; }
        .item {
            background: #1e293b; padding: 10px; border-radius: 8px; cursor: pointer;
            text-align: center; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            border: 1px solid #334155;
        }
        .item:hover { border-color: #3b82f6; color: #60a5fa; }
    </style>
</head>
<body>

    <div class="wrap">
        <h1>Аниме Билдер</h1>
        <div class="subtitle">Генерация прямых потоков в обход блокировок и TDR</div>

        <div class="grid">
            <div class="card">
                <img id="img" src="https://shikimori.io">
                <div id="title" class="title">Загрузка...</div>
                <div id="desc" class="desc">Выберите тайтл из списка ниже.</div>
                
                <!-- Блок сгенерированных билдером ссылок -->
                <div class="btn-group">
                    <a id="shikiLink" href="#" target="_blank" class="watch-btn">Запустить через Shiki Watch 🚀</a>
                    <a id="kodikLink" href="#" target="_blank" class="watch-btn secondary">Открыть прямой плеер Kodik 📺</a>
                </div>
            </div>
        </div>

        <div class="list" id="box"></div>
    </div>

    <script>
        // ТВОЙ МАССИВ ID (Алхимик и Фрирен)
        const ids =;

        let currentId = ids[0];

        async function updatePage() {
            if (!currentId) return;
            try {
                // БИЛДЕР: Генерируем два разных метода обхода!
                // 1. Ссылка на Шикимори для твоего расширения
                document.getElementById('shikiLink').href = 'https://shikimori.io' + currentId + '/video_online';
                
                // 2. Прямая ссылка на зеркало Kodik, которая откроется на вечном чистом плеере без тяжелого интерфейса сайта
                document.getElementById('kodikLink').href = 'https://vko.life' + currentId;
                
                // Легкий одиночный запрос за инфой
                const res = await fetch('https://shikimori.io' + currentId);
                const data = await res.json();
                
                document.getElementById('img').src = data.image ? 'https://shikimori.io' + data.image.original : 'https://shikimori.io';
                document.getElementById('title').innerText = data.russian || data.name;
                document.getElementById('desc').innerText = data.description ? data.description.replace(/\[.*?\]/g, "") : "Описание пусто.";
            } catch (e) {
                console.error(e);
            }
        }

        function selectAnime(id) {
            currentId = id;
            updatePage();
        }

        // Рендерим кнопки выбора
        ids.forEach(id => {
            const div = document.createElement('div');
            div.className = 'item'; div.innerText = 'ID: ' + id; 
            div.onclick = () => selectAnime(id);
            document.getElementById('box').appendChild(div);
            
            // Подгружаем русские имена
            fetch('https://shikimori.io' + id)
                .then(r => r.json())
                .then(d => div.innerText = d.russian || d.name);
        });

        updatePage();
    </script>

</body>
</html>
