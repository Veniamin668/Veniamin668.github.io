            --glow-end: rgba(79, 172, 254, 0.5);

        [data-theme="neon"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0b0e1a 0%, #1a0b2e 70%);
            --bg-item: rgba(20, 10, 40, 0.6);
            --bg-item-hover: rgba(40, 20, 80, 0.8);
            --bg-search: rgba(20, 10, 40, 0.6);
            --bg-modal: rgba(10, 5, 25, 0.95);
            --text-primary: #e0d0ff;
            --text-secondary: #c4b0ff;

            --text-dim: #8060b0;
            --border-color: rgba(180, 120, 255, 0.2);
            --shadow-color: rgba(120, 80, 255, 0.3);
            --btn-preview-bg: rgba(180, 120, 255, 0.15);
            --btn-preview-hover: rgba(180, 120, 255, 0.3);
            --glow-start: rgba(200, 100, 255, 0.4);
            --glow-end: rgba(100, 200, 255, 0.6);
            --modal-overlay: rgba(0,0,0,0.8);
        }

        /* ===== ОБЩИЕ ===== */
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .glow-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--glow-start);
            animation: glow 3s ease-in-out infinite alternate;
            letter-spacing: -0.02em;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px var(--glow-start); }
            to { text-shadow: 0 0 40px var(--glow-end), 0 0 60px var(--glow-end); }
        }

        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .theme-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 14px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-btn:hover {
            background: var(--bg-item-hover);
            transform: scale(1.05);
        }
        .theme-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* ===== СТАТИСТИКА И УПРАВЛЕНИЕ ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            justify-content: space-between;
            align-items: center;
        }
        .stats {
            display: flex;
            gap: 25px;
            font-size: 0.95rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .stats span { display: flex; align-items: center; gap: 8px; }
        .stats strong { color: var(--text-secondary); }

        .bar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bar-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .bar-btn:hover {
            background: var(--bg-item-hover);
            color: var(--text-secondary);
        }
        .bar-btn.accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .bar-btn.accent:hover {
            background: var(--accent-hover);
        }

        .color-picker-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .color-picker-wrap input[type="color"] {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .color-picker-wrap input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-picker-wrap input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-color);
            border-radius: 50%;
        }

        /* ===== ФИЛЬТРЫ ===== */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 16px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);

        .filter-btn:hover {

            color: var(--text-secondary);
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

            background: var(--bg-search);

            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.25s;
            box-shadow: 0 4px 30px var(--shadow-color);

            box-shadow: 0 0 15px var(--accent-glow);
        }
        .search-box::placeholder { color: var(--text-dim); }

        .file-list { list-style: none; padding: 0; margin: 0; }
        .file-item {

            align-items: center;
            justify-content: space-between;
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            flex-wrap: wrap;
            gap: 10px;

        .file-item:hover {
            transform: translateY(-2px);
            background: var(--bg-item-hover);
            border-color: var(--accent);
            box-shadow: 0 10px 25px var(--shadow-color);
        }

            align-items: flex-start;
            gap: 16px;
            min-width: 0;
            flex: 1;
        }
        .file-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            margin-top: 2px;
            width: 30px;
            text-align: center;
            color: var(--text-muted);

            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            word-break: break-all;
            font-size: 0.95rem;
            transition: color 0.15s;
        }
        .file-item:hover .file-name { color: var(--accent); }
        .file-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            transition: opacity 0.2s;
        }
        .file-meta.hidden {
            opacity: 0;
            height: 0;
            margin: 0;
            overflow: hidden;
        }
        .file-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {

            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s;
            text-decoration: none;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-download {
            background: var(--accent);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-download:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        .btn-preview {
            background: var(--btn-preview-bg);
            border-color: var(--border-color);
        }
        .btn-preview:hover {
            background: var(--btn-preview-hover);
            transform: scale(1.05);
        }
        .btn-newtab {
            background: var(--btn-preview-bg);
            border-color: var(--border-color);
        }
        .btn-newtab:hover {
            background: var(--btn-preview-hover);
            transform: scale(1.05);
        }
        .no-results {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-style: italic;
            background: var(--bg-item);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        /* ===== МОДАЛКА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(20px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease-out;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-modal);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            max-width: 95vw;
            max-height: 95vh;
            padding: 20px;
            position: relative;
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 80px var(--shadow-color);
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .modal-content.closing {
            animation: scaleOut 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes scaleOut {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.8); opacity: 0; }
        }

        .modal-close, .modal-fullscreen {
            position: absolute;
            top: 12px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--btn-preview-bg);
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .modal-close { right: 16px; }
        .modal-fullscreen { right: 70px; }
        .modal-close:hover, .modal-fullscreen:hover {
            background: var(--btn-preview-hover);
            transform: scale(1.1);
        }

        .modal-media {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            display: block;
        }
        .modal-media video,
        .modal-media audio {
            width: 100%;
            max-width: 900px;
            max-height: 80vh;
            border-radius: 12px;
            outline: none;
        }
        .modal-media img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            object-fit: contain;
        }
        .modal-filename {
            margin: 12px 0 4px;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-align: center;
            max-width: 100%;
            word-break: break-all;
        }

        @media (max-width: 600px) {

            .file-item { padding: 12px 16px; }
            .file-actions { width: 100%; justify-content: flex-end; }
            .btn { font-size: 0.7rem; padding: 5px 10px; }
            .stats { font-size: 0.8rem; gap: 15px; }
            .stats-bar { flex-direction: column; align-items: stretch; }
            .bar-actions { justify-content: center; }
            .modal-content { padding: 12px; }
            .modal-close, .modal-fullscreen { width: 36px; height: 36px; font-size: 1.2rem; }
            .modal-fullscreen { right: 60px; }
        }
    </style>
</head>

</div>

<!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
<div class="modal-overlay" id="modalOverlay">

    // ===== СОСТОЯНИЕ =====
    let currentFilter = 'all';
    let currentSearch = '';
    let showMeta = true; // показывать метаданные

    // ===== ФУНКЦИИ =====

    function getIcon(file) {
        const type = file.type || 'other';
        const ext = file.name.split('.').pop().toLowerCase();
        const icons = {
            image: 'fa-image',
            video: 'fa-video',
            audio: 'fa-music',
            zip: 'fa-file-archive',
            exe: 'fa-cogs',
            apk: 'fa-android',
            img: 'fa-hdd',
            script: 'fa-code',
            doc: 'fa-file-alt'
        };
        if (type === 'image') return icons.image;
        if (type === 'video') return icons.video;
        if (type === 'audio') return icons.audio;
        if (['zip','rar','7z','tar','gz'].includes(ext)) return icons.zip;
        if (['exe','msi'].includes(ext)) return icons.exe;
        if (['apk'].includes(ext)) return icons.apk;
        if (['img','iso'].includes(ext)) return icons.img;
        if (['ps1','bat','sh','cmd'].includes(ext)) return icons.script;
        if (['json','xml','txt','md'].includes(ext)) return icons.doc;
        return 'fa-file';
    }

    function formatDuration(sec) {
        if (!sec) return '—';
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        if (h > 0) return `${h}ч ${m}м ${s}с`;
        if (m > 0) return `${m}м ${s}с`;
        return `${s}с`;
    }

    function formatSize(bytes) {
        if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + ' ГБ';
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' МБ';
        if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' КБ';
        return bytes + ' Б';
    }

    function getFileSizeBytes(sizeStr) {
        const num = parseFloat(sizeStr);
        if (sizeStr.includes('ГБ')) return num * 1073741824;
        if (sizeStr.includes('МБ')) return num * 1048576;
        if (sizeStr.includes('КБ')) return num * 1024;
        return 0;
    }

    function renderMetadata(file) {
        const m = file.metadata || {};
        const type = file.type;
        if (type === 'image') {
            const dim = (m.width && m.height) ? `${m.width}×${m.height}` : '—';
            const date = m.date ? new Date(m.date).toLocaleDateString() : (file.modified ? new Date(file.modified).toLocaleDateString() : '—');
            return `<span><i class="fas fa-arrows-alt"></i> ${dim}</span><span><i class="fas fa-calendar"></i> ${date}</span>`;
        }
        if (type === 'video') {
            const dur = formatDuration(m.duration);
            const res = (m.width && m.height) ? `${m.width}×${m.height}` : '—';
            const codec = m.codec || '—';
            return `<span><i class="fas fa-clock"></i> ${dur}</span><span><i class="fas fa-expand"></i> ${res}</span><span><i class="fas fa-film"></i> ${codec}</span>`;
        }
        if (type === 'audio') {
            const dur = formatDuration(m.duration);
            const sr = m.sampleRate ? (m.sampleRate / 1000).toFixed(1) + ' кГц' : '—';
            const br = m.bitrate ? (m.bitrate / 1000).toFixed(0) + ' кбит/с' : '—';
            return `<span><i class="fas fa-clock"></i> ${dur}</span><span><i class="fas fa-waveform"></i> ${sr}</span><span><i class="fas fa-signal"></i> ${br}</span>`;
        }
        const date = file.modified ? new Date(file.modified).toLocaleDateString() : '—';
        return `<span><i class="fas fa-calendar"></i> ${date}</span>`;
    }

    // ===== ТЕМЫ =====
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === theme);
        });
    }

    // ===== АКЦЕНТНЫЙ ЦВЕТ =====
    function setAccentColor(color) {
        document.documentElement.style.setProperty('--accent', color);
        document.documentElement.style.setProperty('--accent-hover', color + 'cc'); // полупрозрачный для hover
        document.documentElement.style.setProperty('--accent-glow', color + '66');
        localStorage.setItem('accentColor', color);
    }

    // ===== ФИЛЬТРЫ И ПОИСК =====
    function getFilteredData() {
        let filtered = fileData;
        if (currentFilter !== 'all') {
            filtered = filtered.filter(f => f.type === currentFilter);
        }
        if (currentSearch) {
            filtered = filtered.filter(f => f.name.toLowerCase().includes(currentSearch));
        }
        return filtered;
    }

    // ===== СТАТИСТИКА =====
    function updateStats(list) {
        const total = list.length;
        let totalBytes = 0;
        list.forEach(f => totalBytes += getFileSizeBytes(f.size));
        document.getElementById('totalFiles').textContent = total;
        document.getElementById('totalSize').textContent = formatSize(totalBytes);
    }

    // ===== РЕНДЕР =====
    function renderFiles() {
        const list = getFilteredData();
        const listElement = document.getElementById('fileList');
        listElement.innerHTML = '';

        if (list.length === 0) {
            listElement.innerHTML = `<div class="no-results"><i class="fas fa-search"></i> Совпадений не найдено</div>`;
            updateStats([]);
            return;
        }

        list.forEach(file => {
            const fileUrl = BASE_URL + file.name;
            const iconClass = getIcon(file);
            const metaHtml = renderMetadata(file);
            const canPreview = ['image', 'video', 'audio'].includes(file.type);

            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <div class="file-info">
                    <span class="file-icon"><i class="fas ${iconClass}"></i></span>
                    <div class="file-details">
                        <a href="${fileUrl}" class="file-name" download>${file.name}</a>
                        <div class="file-meta ${showMeta ? '' : 'hidden'}">
                            <span><i class="fas fa-weight-hanging"></i> ${file.size}</span>
                            ${metaHtml}
                        </div>
                    </div>
                </div>
                <div class="file-actions">
                    ${canPreview ? `<button class="btn btn-preview" data-url="${fileUrl}" data-name="${file.name}" data-type="${file.type}"><i class="fas fa-eye"></i> Смотреть</button>` : ''}
                    <a href="${fileUrl}" class="btn btn-newtab" target="_blank" title="Открыть в новой вкладке"><i class="fas fa-external-link-alt"></i></a>
                    <a href="${fileUrl}" class="btn btn-download" download><i class="fas fa-download"></i> Скачать</a>
                </div>
            `;
            listElement.appendChild(li);
        });

        // Обработчики на кнопки "Смотреть"
        document.querySelectorAll('.btn-preview').forEach(btn => {
            btn.addEventListener('click', () => {
                openPreview(btn.dataset.url, btn.dataset.name, btn.dataset.type);
            });
        });

        updateStats(list);
    }

    // ===== ПРОСМОТР =====
    function openPreview(url, name, type) {
        const overlay = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        const media = document.getElementById('modalMedia');
        const filename = document.getElementById('modalFilename');

        content.classList.remove('closing');
        media.innerHTML = '';
        filename.textContent = name;

        if (type === 'image') {
            const img = document.createElement('img');
            img.src = url;
            img.className = 'modal-media';
            img.alt = name;
            media.appendChild(img);
        } else if (type === 'video') {
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.autoplay = true;
            video.className = 'modal-media';
            media.appendChild(video);
        } else if (type === 'audio') {
            const audio = document.createElement('audio');
            audio.src = url;
            audio.controls = true;
            audio.autoplay = true;
            audio.className = 'modal-media';
            media.appendChild(audio);
        }

        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closePreview() {
        const overlay = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        content.classList.add('closing');
        setTimeout(() => {
            overlay.classList.remove('active');
            content.classList.remove('closing');
            document.body.style.overflow = '';
            const media = document.getElementById('modalMedia');
            const video = media.querySelector('video');
            const audio = media.querySelector('audio');
            if (video) { video.pause(); video.currentTime = 0; }
            if (audio) { audio.pause(); audio.currentTime = 0; }
        }, 200);
    }

    function toggleFullscreen() {
        const modal = document.getElementById('modalContent');
        if (!document.fullscreenElement) {
            modal.requestFullscreen?.() || modal.webkitRequestFullscreen?.();
        } else {
            document.exitFullscreen?.() || document.webkitExitFullscreen?.();
        }
    }

    // ===== СОБЫТИЯ =====

    // Темы
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });
    // Восстановление темы
    const savedTheme = localStorage.getItem('theme') || 'dark';
    setTheme(savedTheme);

    // Акцентный цвет
    const accentInput = document.getElementById('accentColor');
    const savedAccent = localStorage.getItem('accentColor') || '#2563eb';
    setAccentColor(savedAccent);
    accentInput.value = savedAccent;
    accentInput.addEventListener('input', (e) => setAccentColor(e.target.value));

    // Переключатель метаданных
    document.getElementById('toggleMetaBtn').addEventListener('click', () => {
        showMeta = !showMeta;
        document.getElementById('toggleMetaBtn').innerHTML = showMeta ? '<i class="fas fa-eye"></i> Метаданные' : '<i class="fas fa-eye-slash"></i> Метаданные';
        renderFiles();
    });

    // Фильтры
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderFiles();
        });
    });

    // Поиск
    document.getElementById('search').addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase().trim();
        renderFiles();
    });

    // Модалка
    document.getElementById('modalClose').addEventListener('click', closePreview);
    document.getElementById('modalFullscreen').addEventListener('click', toggleFullscreen);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closePreview();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePreview();
        if (e.key === 'f' && document.getElementById('modalOverlay').classList.contains('active')) {
            toggleFullscreen();
        }
    });

    // ===== СТАРТ =====
    renderFiles();
</script>
