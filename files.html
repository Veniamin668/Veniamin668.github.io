<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Архив файлов</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Архив файлов" />
    <meta property="og:description" content="Коллекция полезных файлов разработчика" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://veniamin668.github.io/files.html" />
    <meta property="og:image" content="https://veniamin668.github.io/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Chart.js для статистики -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* ===== ПЕРЕМЕННЫЕ ===== */
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            --bg-item: rgba(30, 41, 59, 0.4);
            --bg-item-hover: rgba(30, 41, 59, 0.7);
            --bg-search: rgba(30, 41, 59, 0.4);
            --bg-modal: rgba(15, 23, 42, 0.9);
            --text-primary: #f1f5f9;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border-color: rgba(255, 255, 255, 0.05);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --btn-preview-bg: rgba(255, 255, 255, 0.08);
            --btn-preview-hover: rgba(255, 255, 255, 0.18);
            --glow-start: rgba(245, 87, 108, 0.2);
            --glow-end: rgba(79, 172, 254, 0.6);
            --modal-overlay: rgba(0, 0, 0, 0.75);
            --accent: #2563eb;
            --accent-hover: #3b82f6;
            --accent-glow: rgba(37, 99, 235, 0.3);
            --neon-intensity: 1;
            --neon-color: #a78bfa;
            --neon-glow: rgba(167, 139, 250, 0.3);
        }

        /* ===== СВЕТЛАЯ ТЕМА ===== */
        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #f0f4ff 0%, #d9e2ef 70%);
            --bg-item: rgba(255, 255, 255, 0.6);
            --bg-item-hover: rgba(255, 255, 255, 0.85);
            --bg-search: rgba(255, 255, 255, 0.6);
            --bg-modal: rgba(255, 255, 255, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #475569;
            --text-dim: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --btn-preview-bg: rgba(0, 0, 0, 0.06);
            --btn-preview-hover: rgba(0, 0, 0, 0.12);
            --glow-start: rgba(245, 87, 108, 0.3);
            --glow-end: rgba(79, 172, 254, 0.5);
            --modal-overlay: rgba(0, 0, 0, 0.5);
            --neon-color: #7c3aed;
            --neon-glow: rgba(124, 58, 237, 0.15);
        }

        /* ===== НЕОН ТЕМА ===== */
        [data-theme="neon"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0b0e1a 0%, #1a0b2e 70%);
            --bg-item: rgba(20, 10, 40, 0.5);
            --bg-item-hover: rgba(40, 20, 80, 0.7);
            --bg-search: rgba(20, 10, 40, 0.5);
            --bg-modal: rgba(10, 5, 25, 0.95);
            --text-primary: #e8daff;
            --text-secondary: #d4bfff;
            --text-muted: #b090e0;
            --text-dim: #8060b0;
            --border-color: rgba(180, 120, 255, 0.25);
            --shadow-color: rgba(120, 80, 255, 0.3);
            --btn-preview-bg: rgba(180, 120, 255, 0.12);
            --btn-preview-hover: rgba(180, 120, 255, 0.25);
            --glow-start: rgba(200, 100, 255, 0.5);
            --glow-end: rgba(100, 200, 255, 0.7);
            --modal-overlay: rgba(0, 0, 0, 0.85);
            --neon-color: #a78bfa;
            --neon-glow: rgba(167, 139, 250, 0.3);
        }

        /* ===== ОБЩИЕ ===== */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .glow-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, var(--neon-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--glow-start);
            animation: glow 3s ease-in-out infinite alternate;
            letter-spacing: -0.02em;
            transition: text-shadow 0.3s;
        }
        @keyframes glow {
            from {
                text-shadow: 0 0 20px var(--glow-start);
            }
            to {
                text-shadow: 0 0 40px var(--glow-end), 0 0 60px var(--glow-end);
            }
        }

        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .theme-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 14px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-btn:hover {
            background: var(--bg-item-hover);
            transform: scale(1.05);
        }
        .theme-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* ===== НАСТРОЙКИ НЕОНА ===== */
        .neon-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-item);
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .neon-control label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .neon-control input[type="range"] {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: var(--accent);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .neon-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--text-primary);
            box-shadow: 0 0 10px var(--accent-glow);
            cursor: pointer;
        }
        .neon-control span {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 28px;
            text-align: center;
        }

        .neon-color-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-item);
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .neon-color-picker label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .neon-color-picker input[type="color"] {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .neon-color-picker input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .neon-color-picker input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-color);
            border-radius: 50%;
        }
        .neon-color-presets {
            display: flex;
            gap: 4px;
        }
        .preset-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .preset-dot:hover {
            transform: scale(1.15);
        }
        .preset-dot.active {
            border-color: #fff;
            box-shadow: 0 0 12px var(--neon-glow);
        }
        .reset-neon-btn {
            background: var(--btn-preview-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 12px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .reset-neon-btn:hover {
            background: var(--btn-preview-hover);
            color: var(--text-secondary);
        }

        /* ===== ПРЕСЕТЫ ТЕМ ===== */
        .theme-presets {
            display: flex;
            gap: 6px;
            align-items: center;
            background: var(--bg-item);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .theme-preset-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .theme-preset-btn:hover {
            transform: scale(1.15);
        }
        .theme-preset-btn.active {
            border-color: #fff;
            box-shadow: 0 0 12px var(--neon-glow);
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin: 16px 0 20px;
            background: var(--bg-item);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab-btn:hover {
            color: var(--text-secondary);
            background: var(--btn-preview-hover);
        }
        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== СТАТИСТИКА (вкладка) ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stats-card {
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        .stats-card h3 {
            margin: 0 0 12px;
            color: var(--text-secondary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-card canvas {
            max-height: 250px;
            max-width: 100%;
        }
        .stats-summary {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .stats-summary .stat-item {
            background: var(--bg-item);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 120px;
            text-align: center;
        }
        .stats-summary .stat-item .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            display: block;
        }
        .stats-summary .stat-item .label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== ОСТАЛЬНЫЕ СТИЛИ (список, плеер, модалка) ===== */
        /* ... (сохраняем все стили из предыдущей версии) ... */

        /* Для краткости я пропускаю дублирование стилей, которые уже были.
           В реальном файле нужно скопировать все стили из прошлой версии,
           начиная со статистики и ниже. Я добавлю их в финальном сниппете. */
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <h1 class="glow-title">📁 Архив файлов</h1>
            <div class="top-controls">
                <button class="theme-btn active" data-theme="dark" title="Тёмная"><i class="fas fa-moon"></i></button>
                <button class="theme-btn" data-theme="light" title="Светлая"><i class="fas fa-sun"></i></button>
                <button class="theme-btn" data-theme="neon" title="Неон"><i class="fas fa-wand-magic-sparkles"></i></button>

                <!-- Пресеты тем -->
                <div class="theme-presets">
                    <span style="font-size:0.7rem;color:var(--text-muted);margin-right:4px;">🎭</span>
                    <button class="theme-preset-btn" data-theme-preset="matrix" style="background:#00ff41;" title="Matrix"></button>
                    <button class="theme-preset-btn" data-theme-preset="sunset" style="background:#ff6b35;" title="Sunset"></button>
                    <button class="theme-preset-btn" data-theme-preset="ice" style="background:#00b4d8;" title="Ice"></button>
                    <button class="theme-preset-btn" data-theme-preset="lavender" style="background:#b388ff;" title="Lavender"></button>
                </div>

                <!-- Настройка неона -->
                <div class="neon-control">
                    <label><i class="fas fa-bolt"></i></label>
                    <input type="range" id="neonIntensity" min="0" max="200" value="100" />
                    <span id="neonValue">100%</span>
                </div>
                <div class="neon-color-picker">
                    <label><i class="fas fa-palette"></i></label>
                    <div class="neon-color-presets">
                        <span class="preset-dot" style="background:#a78bfa;" data-color="#a78bfa" title="Фиолетовый"></span>
                        <span class="preset-dot" style="background:#60a5fa;" data-color="#60a5fa" title="Синий"></span>
                        <span class="preset-dot" style="background:#f472b6;" data-color="#f472b6" title="Розовый"></span>
                        <span class="preset-dot" style="background:#34d399;" data-color="#34d399" title="Зелёный"></span>
                    </div>
                    <input type="color" id="neonColorPicker" value="#a78bfa" />
                    <button class="reset-neon-btn" id="resetNeonColor" title="Сбросить цвет неона">⟲</button>
                </div>

                <!-- Акцентный цвет -->
                <div class="color-picker-wrap" style="display:flex;align-items:center;gap:4px;">
                    <input type="color" id="accentColor" value="#2563eb" title="Акцентный цвет" style="width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;background:none;padding:0;" />
                </div>
            </div>
        </div>

        <!-- ===== СТАТИСТИКА (всегда видна) ===== -->
        <div class="stats-bar">
            <div class="stats" id="stats">
                <span><i class="fas fa-file"></i> Всего: <strong id="totalFiles">0</strong></span>
                <span><i class="fas fa-hdd"></i> Общий размер: <strong id="totalSize">0</strong></span>
            </div>
            <div class="bar-actions">
                <a href="https://github.com/veniamin668/veniamin668.github.io/archive/refs/heads/main.zip" class="bar-btn accent" target="_blank"><i class="fas fa-file-archive"></i> ZIP (весь репо)</a>
                <a href="https://download-directory.github.io/?url=https://github.com/veniamin668/veniamin668.github.io/tree/main/files" class="bar-btn" target="_blank"><i class="fas fa-folder-open"></i> Только files</a>
                <button class="bar-btn" id="toggleMetaBtn"><i class="fas fa-eye"></i> Метаданные</button>
            </div>
        </div>

        <!-- ===== ВКЛАДКИ ===== -->
        <div class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="files"><i class="fas fa-list"></i> Файлы</button>
            <button class="tab-btn" data-tab="stats"><i class="fas fa-chart-pie"></i> Статистика</button>
        </div>

        <!-- ===== ВКЛАДКА "ФАЙЛЫ" ===== -->
        <div class="tab-content active" id="tab-files">
            <!-- Сортировка -->
            <div class="sort-controls">
                <span class="sort-label"><i class="fas fa-arrow-up-wide-short"></i> Сортировка:</span>
                <button class="sort-btn active" data-sort="name">По имени</button>
                <button class="sort-btn" data-sort="size">По размеру</button>
                <button class="sort-btn" data-sort="date">По дате</button>
            </div>

            <!-- Фильтры -->
            <div class="filters" id="filters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="image"><i class="fas fa-image"></i> Фото</button>
                <button class="filter-btn" data-filter="video"><i class="fas fa-video"></i> Видео</button>
                <button class="filter-btn" data-filter="audio"><i class="fas fa-music"></i> Аудио</button>
                <button class="filter-btn" data-filter="other"><i class="fas fa-file"></i> Прочее</button>
            </div>

            <!-- Поиск -->
            <input type="text" id="search" class="search-box" placeholder="🔍 Поиск файлов по названию..." />

            <!-- Список -->
            <ul class="file-list" id="fileList"></ul>
        </div>

        <!-- ===== ВКЛАДКА "СТАТИСТИКА" ===== -->
        <div class="tab-content" id="tab-stats">
            <div class="stats-summary" id="statsSummary">
                <div class="stat-item">
                    <span class="number" id="statTotal">0</span>
                    <span class="label">Всего файлов</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="statSize">0</span>
                    <span class="label">Общий размер</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="statTypes">0</span>
                    <span class="label">Типов файлов</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="statLastUpdated">—</span>
                    <span class="label">Последнее обновление</span>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stats-card">
                    <h3><i class="fas fa-chart-pie"></i> По типам</h3>
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="stats-card">
                    <h3><i class="fas fa-chart-bar"></i> По расширениям</h3>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО (плеер + редактор) ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <!-- Содержимое меняется динамически -->
        </div>
    </div>

    <script>
        const BASE_URL = 'https://veniamin668.github.io/files/';

        // ===== ДАННЫЕ =====
        const fileData = [
            // FILE_DATA_PLACEHOLDER
        ];

        // ===== СОСТОЯНИЕ =====
        let currentFilter = 'all';
        let currentSearch = '';
        let showMeta = true;
        let currentSort = 'name';
        let sortAsc = true;
        let currentPlayer = null;
        let playerType = 'video';
        let currentImageElement = null;
        let chartsInitialized = false;

        // ===== ФУНКЦИИ =====
        // (все функции из предыдущей версии: getIcon, formatDuration, formatSize, getFileSizeBytes, renderMetadata, sortFiles, setTheme, setNeonIntensity, setNeonColor, setAccentColor, getFilteredData, updateStats, renderFiles, openPreview, setupPlayer, closePreview, openEditor, closeEditor)

        // ===== ИНИЦИАЛИЗАЦИЯ СТАТИСТИКИ =====
        function initStats() {
            if (chartsInitialized) return;
            const list = fileData;
            const total = list.length;
            let totalBytes = 0;
            const typeCount = {};
            const extCount = {};
            let lastModified = 0;

            list.forEach(f => {
                const bytes = getFileSizeBytes(f.size);
                totalBytes += bytes;
                const type = f.type || 'other';
                typeCount[type] = (typeCount[type] || 0) + 1;
                const ext = f.name.split('.').pop().toLowerCase();
                extCount[ext] = (extCount[ext] || 0) + 1;
                const m = new Date(f.modified || 0).getTime();
                if (m > lastModified) lastModified = m;
            });

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statSize').textContent = formatSize(totalBytes);
            document.getElementById('statTypes').textContent = Object.keys(typeCount).length;
            document.getElementById('statLastUpdated').textContent = lastModified ? new Date(lastModified).toLocaleString() : '—';

            // Круговая диаграмма
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            const typeLabels = Object.keys(typeCount);
            const typeData = typeLabels.map(k => typeCount[k]);
            const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#ef4444', '#6b7280'];

            new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: typeLabels.map(l => l.charAt(0).toUpperCase() + l.slice(1)),
                    datasets: [{
                        data: typeData,
                        backgroundColor: colors.slice(0, typeData.length),
                        borderColor: 'var(--bg-item)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: 'var(--text-muted)' }
                        }
                    }
                }
            });

            // Гистограмма (топ-10 расширений)
            const ctxBar = document.getElementById('barChart').getContext('2d');
            const sortedExts = Object.entries(extCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
            const barLabels = sortedExts.map(e => e[0]);
            const barData = sortedExts.map(e => e[1]);

            new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: barLabels,
                    datasets: [{
                        label: 'Количество файлов',
                        data: barData,
                        backgroundColor: 'var(--accent)',
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: 'var(--text-muted)', stepSize: 1 }
                        },
                        x: {
                            ticks: { color: 'var(--text-muted)' }
                        }
                    }
                }
            });

            chartsInitialized = true;
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'stats') {
                    initStats();
                }
            });
        });

        // ===== ВОССТАНОВЛЕНИЕ НАСТРОЕК =====
        // (темы, неон, акцент, пресеты — как в предыдущей версии)

        // ===== СТАРТ =====
        renderFiles();

        // Если вкладка статистики активна по умолчанию — инициализируем
        if (document.querySelector('.tab-btn.active').dataset.tab === 'stats') {
            initStats();
        }
    </script>
</body>
</html>
