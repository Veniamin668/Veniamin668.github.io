        :root {

            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            margin: 0;
            padding: 40px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        /* Эффектный заголовок */
        .glow-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(245, 87, 108, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
            letter-spacing: -0.02em;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(245, 87, 108, 0.2); }
            to { text-shadow: 0 0 40px rgba(79, 172, 254, 0.6), 0 0 60px rgba(245, 87, 108, 0.4); }
        }

        /* Статистика */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.3);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }

        .stats span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats strong {
            color: #e2e8f0;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 1rem;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .search-box:focus {
            border-color: var(--glow-color);
            background: rgba(30, 41, 59, 0.6);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.25), inset 0 0 10px rgba(59, 130, 246, 0.1);
        }

        .search-box::placeholder {
            color: #64748b;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 16px 24px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-item:hover {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(59, 130, 246, 0.1);
        }

        .file-info {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            min-width: 0;
            flex: 1;
        }

        .file-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
            margin-top: 2px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .file-name {
            font-weight: 500;
            color: #e2e8f0;
            text-decoration: none;
            word-break: break-all;
            font-size: 0.95rem;
            transition: color 0.15s ease;
        }

        .file-item:hover .file-name {
            color: #60a5fa;
        }

        .file-meta {
            font-size: 0.78rem;
            color: #94a3b8;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
        }

        .file-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .file-size {
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 500;
            margin-left: 4px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: all 0.15s ease;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-download {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transform: scale(1.03);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35), 0 0 12px rgba(59, 130, 246, 0.2);
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        .btn-preview {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-preview:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.03);
        }

        .btn-preview:active {
            transform: scale(0.98);
        }

            font-style: italic;
            background: rgba(30, 41, 59, 0.2);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.05);

        /* ===== Модальное окно ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            max-width: 90vw;
            max-height: 90vh;
            padding: 20px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .modal-content.closing {
            animation: scaleOut 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes scaleOut {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.8); opacity: 0; }
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #f1f5f9;
            font-size: 1.8rem;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            z-index: 10;
            line-height: 1;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: rotate(90deg);
        }

        .modal-media {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            display: block;
        }

        .modal-media video,

            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            border-radius: 12px;
            outline: none;

            max-height: 80vh;
            border-radius: 12px;
            object-fit: contain;

            .stats {
                font-size: 0.8rem;
                gap: 15px;
                padding: 10px 16px;
            }
            .modal-content {
                padding: 12px;
            }
            .modal-close {
                top: 8px;
                right: 10px;
                width: 36px;
                height: 36px;
                font-size: 1.4rem;
            }
        }

        // === Вспомогательные функции ===

        function getIcon(file) {
            const type = file.type || 'other';
            const name = file.name;
            const ext = name.split('.').pop().toLowerCase();

            if (type === 'image') return '🖼️';
            if (type === 'video') return '🎬';
            if (type === 'audio') return '🎵';
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return '📦';
            if (['exe', 'msi'].includes(ext)) return '⚙️';
            if (['apk'].includes(ext)) return '🤖';
            if (['img', 'iso'].includes(ext)) return '💾';
            if (['ps1', 'bat', 'sh', 'cmd'].includes(ext)) return '📜';
            if (['json', 'xml', 'txt', 'md'].includes(ext)) return '📄';
            return '📁';
        }

        function formatDuration(sec) {
            if (!sec) return '—';
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.floor(sec % 60);
            if (h > 0) return `${h}ч ${m}м ${s}с`;
            if (m > 0) return `${m}м ${s}с`;
            return `${s}с`;
        }

        function formatSize(bytes) {
            if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + ' ГБ';
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' МБ';
            if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' КБ';
            return bytes + ' Б';
        }

        function renderMetadata(file) {
            const m = file.metadata || {};
            const type = file.type;

            if (type === 'image') {
                const dim = (m.width && m.height) ? `${m.width}×${m.height}` : '—';
                const date = m.date ? new Date(m.date).toLocaleDateString() : (file.modified ? new Date(file.modified).toLocaleDateString() : '—');
                return `
                    <span>📐 ${dim}</span>
                    <span>📅 ${date}</span>
                `;
            }

            if (type === 'video') {
                const dur = formatDuration(m.duration);
                const res = (m.width && m.height) ? `${m.width}×${m.height}` : '—';
                const codec = m.codec || '—';
                return `
                    <span>⏱ ${dur}</span>
                    <span>📐 ${res}</span>
                    <span>🎞 ${codec}</span>
                `;
            }

            if (type === 'audio') {
                const dur = formatDuration(m.duration);
                const sr = m.sampleRate ? (m.sampleRate / 1000).toFixed(1) + ' кГц' : '—';
                const br = m.bitrate ? (m.bitrate / 1000).toFixed(0) + ' кбит/с' : '—';
                return `
                    <span>⏱ ${dur}</span>
                    <span>🎵 ${sr}</span>
                    <span>📊 ${br}</span>
                `;
            }

            const date = file.modified ? new Date(file.modified).toLocaleDateString() : '—';
            return `<span>📅 ${date}</span>`;
        }

        function getFileSizeBytes(sizeStr) {
            const num = parseFloat(sizeStr);
            if (sizeStr.includes('ГБ')) return num * 1073741824;
            if (sizeStr.includes('МБ')) return num * 1048576;
            if (sizeStr.includes('КБ')) return num * 1024;
            return 0;
        }

        // === Обновление статистики ===
        function updateStats(list) {
            const total = list.length;
            let totalBytes = 0;
            list.forEach(f => {
                totalBytes += getFileSizeBytes(f.size);
            });
            document.getElementById('totalFiles').textContent = total;
            document.getElementById('totalSize').textContent = formatSize(totalBytes);
        }

        // === Рендеринг списка ===
        function renderFiles(list) {
            const listElement = document.getElementById('fileList');
            listElement.innerHTML = '';

            if (list.length === 0) {
                listElement.innerHTML = `<div class="no-results">Совпадений не найдено</div>`;
                updateStats([]);
                return;
            }

            list.forEach(file => {
                const fileUrl = BASE_URL + file.name;
                const icon = getIcon(file);
                const metaHtml = renderMetadata(file);
                const canPreview = ['image', 'video', 'audio'].includes(file.type);

                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon">${icon}</span>
                        <div class="file-details">
                            <a href="${fileUrl}" class="file-name" download>${file.name}</a>
                            <div class="file-meta">
                                <span>📦 ${file.size}</span>
                                ${metaHtml}
                            </div>
                        </div>
                    </div>
                    <div class="file-actions">
                        ${canPreview ? `<button class="btn btn-preview" data-url="${fileUrl}" data-name="${file.name}" data-type="${file.type}">👁️ Смотреть</button>` : ''}
                        <a href="${fileUrl}" class="btn btn-download" download>⬇️ Скачать</a>
                    </div>
                `;
                listElement.appendChild(li);
            });

            // Навешиваем обработчики на кнопки "Смотреть"
            document.querySelectorAll('.btn-preview').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const url = btn.dataset.url;
                    const name = btn.dataset.name;
                    const type = btn.dataset.type;
                    openPreview(url, name, type);
                });
            });

            updateStats(list);
        }

        // === Открытие просмотра ===
        function openPreview(url, name, type) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            const media = document.getElementById('modalMedia');
            const filename = document.getElementById('modalFilename');

            // Убираем анимацию закрытия, если была
            content.classList.remove('closing');

            media.innerHTML = '';
            filename.textContent = name;

            if (type === 'image') {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'modal-media';
                img.alt = name;
                media.appendChild(img);
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.className = 'modal-media';
                media.appendChild(video);
            } else if (type === 'audio') {
                const audio = document.createElement('audio');
                audio.src = url;
                audio.controls = true;
                audio.autoplay = true;
                audio.className = 'modal-media';
                media.appendChild(audio);
            }

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // === Закрытие просмотра с анимацией ===
        function closePreview() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');

            content.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('active');
                content.classList.remove('closing');
                document.body.style.overflow = '';
                // Останавливаем видео/аудио
                const media = document.getElementById('modalMedia');
                const video = media.querySelector('video');
                const audio = media.querySelector('audio');
                if (video) { video.pause(); video.currentTime = 0; }
                if (audio) { audio.pause(); audio.currentTime = 0; }
            }, 200);
        }

        // === Обработчики модалки ===
        document.getElementById('modalClose').addEventListener('click', closePreview);

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closePreview();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePreview();
            }
        });

        // === Поиск ===
        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = fileData.filter(file => file.name.toLowerCase().includes(query));
            renderFiles(filtered);
        });

        // === Первоначальный рендер ===
        renderFiles(fileData);
    </script>

</body>
</html>
