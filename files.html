<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Архив файлов</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Архив файлов" />
    <meta property="og:description" content="Коллекция полезных файлов разработчика" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://veniamin668.github.io/files.html" />
    <meta property="og:image" content="https://veniamin668.github.io/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ===== ПЕРЕМЕННЫЕ ===== */
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            --bg-item: rgba(30, 41, 59, 0.4);
            --bg-item-hover: rgba(30, 41, 59, 0.7);
            --bg-search: rgba(30, 41, 59, 0.4);
            --bg-modal: rgba(15, 23, 42, 0.9);
            --text-primary: #f1f5f9;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border-color: rgba(255, 255, 255, 0.05);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --btn-preview-bg: rgba(255, 255, 255, 0.08);
            --btn-preview-hover: rgba(255, 255, 255, 0.18);
            --glow-start: rgba(245, 87, 108, 0.2);
            --glow-end: rgba(79, 172, 254, 0.6);
            --modal-overlay: rgba(0, 0, 0, 0.75);
            --accent: #2563eb;
            --accent-hover: #3b82f6;
            --accent-glow: rgba(37, 99, 235, 0.3);
            --neon-intensity: 1;
            --neon-color: #a78bfa; /* основной цвет неона */
            --neon-glow: rgba(167, 139, 250, 0.3);
        }

        /* ===== СВЕТЛАЯ ТЕМА ===== */
        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #f0f4ff 0%, #d9e2ef 70%);
            --bg-item: rgba(255, 255, 255, 0.6);
            --bg-item-hover: rgba(255, 255, 255, 0.85);
            --bg-search: rgba(255, 255, 255, 0.6);
            --bg-modal: rgba(255, 255, 255, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #475569;
            --text-dim: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --btn-preview-bg: rgba(0, 0, 0, 0.06);
            --btn-preview-hover: rgba(0, 0, 0, 0.12);
            --glow-start: rgba(245, 87, 108, 0.3);
            --glow-end: rgba(79, 172, 254, 0.5);
            --modal-overlay: rgba(0, 0, 0, 0.5);
            --neon-color: #7c3aed;
            --neon-glow: rgba(124, 58, 237, 0.15);
        }

        /* ===== НЕОН ТЕМА (усиленная) ===== */
        [data-theme="neon"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0b0e1a 0%, #1a0b2e 70%);
            --bg-item: rgba(20, 10, 40, 0.5);
            --bg-item-hover: rgba(40, 20, 80, 0.7);
            --bg-search: rgba(20, 10, 40, 0.5);
            --bg-modal: rgba(10, 5, 25, 0.95);
            --text-primary: #e8daff;
            --text-secondary: #d4bfff;
            --text-muted: #b090e0;
            --text-dim: #8060b0;
            --border-color: rgba(180, 120, 255, 0.25);
            --shadow-color: rgba(120, 80, 255, 0.3);
            --btn-preview-bg: rgba(180, 120, 255, 0.12);
            --btn-preview-hover: rgba(180, 120, 255, 0.25);
            --glow-start: rgba(200, 100, 255, 0.5);
            --glow-end: rgba(100, 200, 255, 0.7);
            --modal-overlay: rgba(0, 0, 0, 0.85);
            --neon-color: #a78bfa;
            --neon-glow: rgba(167, 139, 250, 0.3);
        }

        /* ===== ОБЩИЕ ===== */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 820px;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .glow-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, var(--neon-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--glow-start);
            animation: glow 3s ease-in-out infinite alternate;
            letter-spacing: -0.02em;
            transition: text-shadow 0.3s;
        }
        @keyframes glow {
            from {
                text-shadow: 0 0 20px var(--glow-start);
            }
            to {
                text-shadow: 0 0 40px var(--glow-end), 0 0 60px var(--glow-end);
            }
        }

        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .theme-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 14px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-btn:hover {
            background: var(--bg-item-hover);
            transform: scale(1.05);
        }
        .theme-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* ===== НАСТРОЙКА НЕОНА ===== */
        .neon-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-item);
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .neon-control label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .neon-control input[type="range"] {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: var(--accent);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .neon-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--text-primary);
            box-shadow: 0 0 10px var(--accent-glow);
            cursor: pointer;
        }
        .neon-control span {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 28px;
            text-align: center;
        }

        .neon-color-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-item);
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .neon-color-picker label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .neon-color-picker input[type="color"] {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .neon-color-picker input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .neon-color-picker input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-color);
            border-radius: 50%;
        }
        .neon-color-presets {
            display: flex;
            gap: 4px;
        }
        .preset-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .preset-dot:hover {
            transform: scale(1.15);
        }
        .preset-dot.active {
            border-color: #fff;
            box-shadow: 0 0 12px var(--neon-glow);
        }
        .reset-neon-btn {
            background: var(--btn-preview-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 12px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .reset-neon-btn:hover {
            background: var(--btn-preview-hover);
            color: var(--text-secondary);
        }

        /* ===== СТАТИСТИКА ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            justify-content: space-between;
            align-items: center;
        }
        .stats {
            display: flex;
            gap: 25px;
            font-size: 0.95rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .stats span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats strong {
            color: var(--text-secondary);
        }
        .bar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .bar-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .bar-btn:hover {
            background: var(--bg-item-hover);
            color: var(--text-secondary);
        }
        .bar-btn.accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .bar-btn.accent:hover {
            background: var(--accent-hover);
        }

        /* ===== СОРТИРОВКА ===== */
        .sort-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .sort-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-right: 4px;
        }
        .sort-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 4px 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .sort-btn:hover {
            background: var(--bg-item-hover);
            color: var(--text-secondary);
        }
        .sort-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== ФИЛЬТРЫ ===== */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 16px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .filter-btn:hover {
            background: var(--bg-item-hover);
            color: var(--text-secondary);
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== ПОИСК ===== */
        .search-box {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 20px;
            background: var(--bg-search);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.25s;
            box-shadow: 0 4px 30px var(--shadow-color);
        }
        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .search-box::placeholder {
            color: var(--text-dim);
        }

        /* ===== СПИСОК ===== */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.25s;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }

        /* ===== НЕОН-ПОДСВЕТКА ДЛЯ КАРТОЧЕК (теперь с переменной цвета) ===== */
        [data-theme="neon"] .file-item {
            box-shadow: 0 0 calc(8px * var(--neon-intensity)) var(--neon-glow),
                0 0 calc(20px * var(--neon-intensity)) rgba(0, 0, 0, 0.2);
            border-color: var(--neon-color);
            transition: box-shadow 0.3s, transform 0.2s;
        }
        [data-theme="neon"] .file-item:hover {
            box-shadow: 0 0 calc(15px * var(--neon-intensity)) var(--neon-glow),
                0 0 calc(40px * var(--neon-intensity)) rgba(0, 0, 0, 0.2);
            border-color: var(--neon-color);
            transform: translateY(-2px);
        }
        [data-theme="neon"] .search-box {
            box-shadow: 0 0 calc(10px * var(--neon-intensity)) var(--neon-glow);
        }
        [data-theme="neon"] .search-box:focus {
            box-shadow: 0 0 calc(20px * var(--neon-intensity)) var(--neon-glow);
        }
        [data-theme="neon"] .glow-title {
            animation: neonPulse 2s ease-in-out infinite alternate;
        }
        @keyframes neonPulse {
            0% {
                text-shadow: 0 0 calc(20px * var(--neon-intensity)) var(--neon-glow);
            }
            100% {
                text-shadow: 0 0 calc(40px * var(--neon-intensity)) var(--neon-glow),
                    0 0 calc(60px * var(--neon-intensity)) rgba(0, 0, 0, 0.2);
            }
        }
        [data-theme="neon"] .stats-bar,
        [data-theme="neon"] .filters .filter-btn,
        [data-theme="neon"] .sort-controls .sort-btn,
        [data-theme="neon"] .bar-btn {
            border-color: var(--neon-color);
        }
        [data-theme="neon"] .filter-btn.active,
        [data-theme="neon"] .sort-btn.active {
            background: var(--neon-color);
            border-color: var(--neon-color);
        }

        .file-item:hover {
            transform: translateY(-2px);
            background: var(--bg-item-hover);
            border-color: var(--accent);
            box-shadow: 0 10px 25px var(--shadow-color);
        }

        .file-info {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            min-width: 0;
            flex: 1;
        }
        .file-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            margin-top: 2px;
            width: 30px;
            text-align: center;
            color: var(--text-muted);
        }
        .file-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .file-name {
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            word-break: break-all;
            font-size: 0.95rem;
            transition: color 0.15s;
        }
        .file-item:hover .file-name {
            color: var(--accent);
        }
        .file-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            transition: opacity 0.2s;
        }
        .file-meta.hidden {
            opacity: 0;
            height: 0;
            margin: 0;
            overflow: hidden;
        }
        .file-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s;
            text-decoration: none;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-download {
            background: var(--accent);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-download:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        .btn-preview {
            background: var(--btn-preview-bg);
            border-color: var(--border-color);
        }
        .btn-preview:hover {
            background: var(--btn-preview-hover);
            transform: scale(1.05);
        }
        .btn-newtab {
            background: var(--btn-preview-bg);
            border-color: var(--border-color);
        }
        .btn-newtab:hover {
            background: var(--btn-preview-hover);
            transform: scale(1.05);
        }
        .btn-copy {
            background: var(--btn-preview-bg);
            border-color: var(--border-color);
        }
        .btn-copy:hover {
            background: var(--btn-preview-hover);
            transform: scale(1.05);
        }
        .no-results {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-style: italic;
            background: var(--bg-item);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        /* ============================================================
                   КАСТОМНЫЙ ПЛЕЕР
                   ============================================================ */
        .player-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-wrapper audio {
            width: 100%;
            height: 60px;
        }
        .player-wrapper video,
        .player-wrapper audio {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }
        .player-wrapper video::-webkit-media-controls {
            display: none !important;
        }
        .player-wrapper audio::-webkit-media-controls {
            display: none !important;
        }
        .player-wrapper video::-moz-media-controls {
            display: none !important;
        }
        .player-wrapper audio::-moz-media-controls {
            display: none !important;
        }

        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px 12px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8) 70%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .player-wrapper:hover .custom-controls,
        .custom-controls.show {
            opacity: 1;
            pointer-events: auto;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .controls-row .btn-ctrl {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 6px;
            transition: 0.15s;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }
        .controls-row .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }
        .controls-row .btn-ctrl:active {
            transform: scale(0.95);
        }

        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 100px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }
        .progress-bar:hover {
            height: 6px;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
            transition: width 0.05s linear;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .progress-time {
            font-size: 0.8rem;
            color: #ccc;
            font-variant-numeric: tabular-nums;
            min-width: 80px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .volume-control input[type="range"] {
            width: 60px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
        }
        .volume-control .vol-icon {
            color: #fff;
            font-size: 1rem;
            width: 24px;

        .fullscreen-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(20px);
            z-index: 1000;
            align-items: center;

        .modal-content {
            background: var(--bg-modal);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            max-width: 95vw;

        .modal-content.closing {

        }
        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;

        }
        @keyframes scaleOut {

        .modal-close {

        /* Фуллскрин для изображений */

        /* ===== АДАПТИВ ===== */
        @media (max-width: 600px) {

    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <h1 class="glow-title">📁 Архив файлов</h1>
            <div class="top-controls">
                <button class="theme-btn active" data-theme="dark" title="Тёмная"><i class="fas fa-moon"></i></button>
                <button class="theme-btn" data-theme="light" title="Светлая"><i class="fas fa-sun"></i></button>
                <button class="theme-btn" data-theme="neon" title="Неон"><i class="fas fa-wand-magic-sparkles"></i></button>

                <!-- Настройка неона: интенсивность -->
                <div class="neon-control">
                    <label><i class="fas fa-bolt"></i></label>
                    <input type="range" id="neonIntensity" min="0" max="200" value="100" />
                    <span id="neonValue">100%</span>
                </div>

                <!-- Настройка неона: цвет -->
                <div class="neon-color-picker">
                    <label><i class="fas fa-palette"></i></label>
                    <div class="neon-color-presets">
                        <span class="preset-dot" style="background:#a78bfa;" data-color="#a78bfa" title="Фиолетовый"></span>
                        <span class="preset-dot" style="background:#60a5fa;" data-color="#60a5fa" title="Синий"></span>
                        <span class="preset-dot" style="background:#f472b6;" data-color="#f472b6" title="Розовый"></span>
                        <span class="preset-dot" style="background:#34d399;" data-color="#34d399" title="Зелёный"></span>
                    </div>
                    <input type="color" id="neonColorPicker" value="#a78bfa" />
                    <button class="reset-neon-btn" id="resetNeonColor" title="Сбросить цвет неона">⟲</button>
                </div>

                <!-- Акцентный цвет (для кнопок) -->
                <div class="color-picker-wrap" style="display:flex;align-items:center;gap:4px;">
                    <input type="color" id="accentColor" value="#2563eb" title="Акцентный цвет" style="width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;background:none;padding:0;" />
                </div>
            </div>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats-bar">
            <div class="stats" id="stats">
                <span><i class="fas fa-file"></i> Всего: <strong id="totalFiles">0</strong></span>
                <span><i class="fas fa-hdd"></i> Общий размер: <strong id="totalSize">0</strong></span>
            </div>
            <div class="bar-actions">
                <a href="https://github.com/veniamin668/veniamin668.github.io/archive/refs/heads/main.zip" class="bar-btn accent" target="_blank"><i class="fas fa-file-archive"></i> ZIP (весь репо)</a>
                <a href="https://download-directory.github.io/?url=https://github.com/veniamin668/veniamin668.github.io/tree/main/files" class="bar-btn" target="_blank"><i class="fas fa-folder-open"></i> Только files</a>
                <button class="bar-btn" id="toggleMetaBtn"><i class="fas fa-eye"></i> Метаданные</button>
            </div>
        </div>

        <!-- ===== СОРТИРОВКА ===== -->
        <div class="sort-controls">
            <span class="sort-label"><i class="fas fa-arrow-up-wide-short"></i> Сортировка:</span>
            <button class="sort-btn active" data-sort="name">По имени</button>
            <button class="sort-btn" data-sort="size">По размеру</button>
            <button class="sort-btn" data-sort="date">По дате</button>
        </div>

        <!-- ===== ФИЛЬТРЫ ===== -->
        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="image"><i class="fas fa-image"></i> Фото</button>
            <button class="filter-btn" data-filter="video"><i class="fas fa-video"></i> Видео</button>
            <button class="filter-btn" data-filter="audio"><i class="fas fa-music"></i> Аудио</button>
            <button class="filter-btn" data-filter="other"><i class="fas fa-file"></i> Прочее</button>
        </div>

        <!-- ===== ПОИСК ===== -->
        <input type="text" id="search" class="search-box" placeholder="🔍 Поиск файлов по названию..." />

        <!-- ===== СПИСОК ===== -->
        <ul class="file-list" id="fileList"></ul>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО С ПЛЕЕРОМ ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>

            <!-- Контейнер плеера (для видео/аудио) или изображение -->
            <div class="player-wrapper" id="playerWrapper">
                <div id="playerContainer" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>

                <!-- Кастомные контролы (для видео/аудио) -->
                <div class="custom-controls" id="customControls">
                    <div class="controls-row">
                        <button class="btn-ctrl" id="playBtn" title="Play/Pause"><i class="fas fa-play"></i></button>

                        <div class="progress-container">
                            <span class="progress-time" id="currentTimeDisplay">0:00</span>
                            <div class="progress-bar" id="progressBar">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                            <span class="progress-time" id="durationDisplay">0:00</span>
                        </div>

                        <div class="volume-control">
                            <span class="vol-icon" id="volIcon"><i class="fas fa-volume-up"></i></span>
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
                        </div>

                        <button class="fullscreen-btn" id="fullscreenBtn" title="Полный экран"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
            </div>

            <!-- Кнопка фуллскрина для изображений -->
            <button class="image-fullscreen-btn" id="imageFullscreenBtn" style="display:none;"><i class="fas fa-expand"></i></button>

            <div class="modal-filename" id="modalFilename"></div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://veniamin668.github.io/files/';

        // ===== ДАННЫЕ =====
        const fileData = [
            // FILE_DATA_PLACEHOLDER
        ];

        // ===== СОСТОЯНИЕ =====
        let currentFilter = 'all';
        let currentSearch = '';
        let showMeta = true;
        let currentSort = 'name';
        let sortAsc = true;
        let currentPlayer = null;
        let playerType = 'video';
        let currentImageElement = null; // для фуллскрина фото

        // ===== ФУНКЦИИ =====

        function getIcon(file) {
            const type = file.type || 'other';
            const ext = file.name.split('.').pop().toLowerCase();
            const icons = {
                image: 'fa-image',
                video: 'fa-video',
                audio: 'fa-music',
                zip: 'fa-file-archive',
                exe: 'fa-cogs',
                apk: 'fa-android',
                img: 'fa-hdd',
                script: 'fa-code',
                doc: 'fa-file-alt'
            };
            if (type === 'image') return icons.image;
            if (type === 'video') return icons.video;
            if (type === 'audio') return icons.audio;
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return icons.zip;
            if (['exe', 'msi'].includes(ext)) return icons.exe;
            if (['apk'].includes(ext)) return icons.apk;
            if (['img', 'iso'].includes(ext)) return icons.img;
            if (['ps1', 'bat', 'sh', 'cmd'].includes(ext)) return icons.script;
            if (['json', 'xml', 'txt', 'md'].includes(ext)) return icons.doc;
            return 'fa-file';
        }

        function formatDuration(sec) {
            if (!sec) return '—';
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.floor(sec % 60);
            if (h > 0) return `${h}ч ${m}м ${s}с`;
            if (m > 0) return `${m}м ${s}с`;
            return `${s}с`;
        }

        function formatSize(bytes) {
            if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + ' ГБ';
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' МБ';
            if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' КБ';
            return bytes + ' Б';
        }

        function getFileSizeBytes(sizeStr) {
            const num = parseFloat(sizeStr);
            if (sizeStr.includes('ГБ')) return num * 1073741824;
            if (sizeStr.includes('МБ')) return num * 1048576;
            if (sizeStr.includes('КБ')) return num * 1024;
            return 0;
        }

        function renderMetadata(file) {
            const m = file.metadata || {};
            const type = file.type;
            if (type === 'image') {
                const dim = (m.width && m.height) ? `${m.width}×${m.height}` : '—';
                const date = m.date ? new Date(m.date).toLocaleDateString() : (file.modified ? new Date(file.modified)
                    .toLocaleDateString() : '—');
                return `<span><i class="fas fa-arrows-alt"></i> ${dim}</span><span><i class="fas fa-calendar"></i> ${date}</span>`;
            }
            if (type === 'video') {
                const dur = formatDuration(m.duration);
                const res = (m.width && m.height) ? `${m.width}×${m.height}` : '—';
                const codec = m.codec || '—';
                return `<span><i class="fas fa-clock"></i> ${dur}</span><span><i class="fas fa-expand"></i> ${res}</span><span><i class="fas fa-film"></i> ${codec}</span>`;
            }
            if (type === 'audio') {
                const dur = formatDuration(m.duration);
                const sr = m.sampleRate ? (m.sampleRate / 1000).toFixed(1) + ' кГц' : '—';
                const br = m.bitrate ? (m.bitrate / 1000).toFixed(0) + ' кбит/с' : '—';
                return `<span><i class="fas fa-clock"></i> ${dur}</span><span><i class="fas fa-waveform"></i> ${sr}</span><span><i class="fas fa-signal"></i> ${br}</span>`;
            }
            const date = file.modified ? new Date(file.modified).toLocaleDateString() : '—';
            return `<span><i class="fas fa-calendar"></i> ${date}</span>`;
        }

        // ===== СОРТИРОВКА =====
        function sortFiles(list) {
            const sorted = [...list];
            sorted.sort((a, b) => {
                let valA, valB;
                switch (currentSort) {
                    case 'name':
                        valA = a.name.toLowerCase();
                        valB = b.name.toLowerCase();
                        break;
                    case 'size':
                        valA = getFileSizeBytes(a.size);
                        valB = getFileSizeBytes(b.size);
                        break;
                    case 'date':
                        valA = new Date(a.modified || 0);
                        valB = new Date(b.modified || 0);
                        break;
                    default:
                        return 0;
                }
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });
            return sorted;
        }

        // ===== ТЕМЫ =====
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
            const neonControls = document.querySelectorAll('.neon-control, .neon-color-picker, .reset-neon-btn');
            if (theme === 'neon') {
                neonControls.forEach(el => el.style.display = 'flex');
            } else {
                neonControls.forEach(el => el.style.display = 'none');
            }
        }

        // ===== НЕОН ИНТЕНСИВНОСТЬ =====
        function setNeonIntensity(value) {
            const val = value / 100;
            document.documentElement.style.setProperty('--neon-intensity', val);
            document.getElementById('neonValue').textContent = value + '%';
            localStorage.setItem('neonIntensity', value);
        }

        // ===== НЕОН ЦВЕТ =====
        function setNeonColor(color) {
            document.documentElement.style.setProperty('--neon-color', color);
            // Вычисляем полупрозрачный glow
            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            document.documentElement.style.setProperty('--neon-glow', `rgba(${r},${g},${b},0.3)`);
            localStorage.setItem('neonColor', color);
            // Обновить индикаторы пресетов
            document.querySelectorAll('.preset-dot').forEach(dot => {
                dot.classList.toggle('active', dot.dataset.color === color);
            });
            document.getElementById('neonColorPicker').value = color;
        }

        // ===== АКЦЕНТНЫЙ ЦВЕТ =====
        function setAccentColor(color) {
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--accent-hover', color + 'cc');
            document.documentElement.style.setProperty('--accent-glow', color + '66');
            localStorage.setItem('accentColor', color);
        }

        // ===== ФИЛЬТРЫ =====
        function getFilteredData() {
            let filtered = fileData;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(f => f.type === currentFilter);
            }
            if (currentSearch) {
                filtered = filtered.filter(f => f.name.toLowerCase().includes(currentSearch));
            }
            return sortFiles(filtered);
        }

        // ===== СТАТИСТИКА =====
        function updateStats(list) {
            const total = list.length;
            let totalBytes = 0;
            list.forEach(f => totalBytes += getFileSizeBytes(f.size));
            document.getElementById('totalFiles').textContent = total;
            document.getElementById('totalSize').textContent = formatSize(totalBytes);
        }

        // ===== РЕНДЕР =====
        function renderFiles() {
            const list = getFilteredData();
            const listElement = document.getElementById('fileList');
            listElement.innerHTML = '';

            if (list.length === 0) {
                listElement.innerHTML =
                    `<div class="no-results"><i class="fas fa-search"></i> Совпадений не найдено</div>`;
                updateStats([]);
                return;
            }

            list.forEach(file => {
                const fileUrl = BASE_URL + file.name;
                const iconClass = getIcon(file);
                const metaHtml = renderMetadata(file);
                const canPreview = ['image', 'video', 'audio'].includes(file.type);

                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                        <div class="file-info">
                            <span class="file-icon"><i class="fas ${iconClass}"></i></span>
                            <div class="file-details">
                                <a href="${fileUrl}" class="file-name" download>${file.name}</a>
                                <div class="file-meta ${showMeta ? '' : 'hidden'}">
                                    <span><i class="fas fa-weight-hanging"></i> ${file.size}</span>
                                    ${metaHtml}
                                </div>
                            </div>
                        </div>
                        <div class="file-actions">
                            ${canPreview ? `<button class="btn btn-preview" data-url="${fileUrl}" data-name="${file.name}" data-type="${file.type}"><i class="fas fa-eye"></i> Смотреть</button>` : ''}
                            <button class="btn btn-copy" data-url="${fileUrl}" title="Копировать ссылку"><i class="fas fa-link"></i></button>
                            <a href="${fileUrl}" class="btn btn-newtab" target="_blank" title="Открыть в новой вкладке"><i class="fas fa-external-link-alt"></i></a>
                            <a href="${fileUrl}" class="btn btn-download" download><i class="fas fa-download"></i> Скачать</a>
                        </div>
                    `;
                listElement.appendChild(li);
            });

            // Обработчики для кнопок "Смотреть"
            document.querySelectorAll('.btn-preview').forEach(btn => {
                btn.addEventListener('click', () => {
                    openPreview(btn.dataset.url, btn.dataset.name, btn.dataset.type);
                });
            });

            // Обработчики для кнопок "Копировать ссылку"
            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.dataset.url;
                    navigator.clipboard.writeText(url).then(() => {
                        const original = btn.innerHTML;
                        btn.innerHTML = '<i class="fas fa-check"></i>';
                        setTimeout(() => btn.innerHTML = original, 2000);
                    }).catch(() => {
                        alert('Не удалось скопировать ссылку');
                    });
                });
            });

            updateStats(list);
        }

        // ============================================================
        //  КАСТОМНЫЙ ПЛЕЕР
        // ============================================================

        function openPreview(url, name, type) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            const container = document.getElementById('playerContainer');
            const filename = document.getElementById('modalFilename');
            const wrapper = document.getElementById('playerWrapper');
            const imageFullscreenBtn = document.getElementById('imageFullscreenBtn');

            content.classList.remove('closing');
            container.innerHTML = '';
            filename.textContent = name;
            imageFullscreenBtn.style.display = 'none';
            currentImageElement = null;

            if (type === 'image') {
                // Для изображений показываем картинку с возможностью фуллскрина
                wrapper.style.aspectRatio = 'auto';
                document.querySelector('.custom-controls').style.display = 'none';

                const img = document.createElement('img');
                img.src = url;
                img.style.maxWidth = '90vw';
                img.style.maxHeight = '80vh';
                img.style.borderRadius = '12px';
                img.style.objectFit = 'contain';
                img.style.display = 'block';
                container.appendChild(img);
                currentImageElement = img;

                // Показываем кнопку фуллскрина для фото
                imageFullscreenBtn.style.display = 'flex';
                // Добавляем обработчик на кнопку
                imageFullscreenBtn.onclick = () => {
                    if (!document.fullscreenElement) {
                        wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                    } else {
                        document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                    }
                };

                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                return;
            } else {
                // Для видео/аудио показываем контролы
                document.querySelector('.custom-controls').style.display = 'flex';
                wrapper.style.aspectRatio = type === 'video' ? '16/9' : 'auto';
                let media;
                if (type === 'video') {
                    media = document.createElement('video');
                    media.setAttribute('playsinline', '');
                } else {
                    media = document.createElement('audio');
                }
                media.src = url;
                media.controls = false;
                media.style.width = '100%';
                media.style.height = '100%';
                media.style.display = 'block';
                media.style.background = '#000';
                container.appendChild(media);
                currentPlayer = media;
                playerType = type;
                setupPlayer(media);
                media.play().catch(() => {});
            }

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function setupPlayer(media) {
            const playBtn = document.getElementById('playBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            const volumeSlider = document.getElementById('volumeSlider');
            const volIcon = document.getElementById('volIcon');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const wrapper = document.getElementById('playerWrapper');

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                return `${m}:${String(s).padStart(2,'0')}`;
            }

            function updateProgress() {
                if (!media) return;
                const percent = media.duration ? (media.currentTime / media.duration) * 100 : 0;
                progressFill.style.width = percent + '%';
                currentTimeDisplay.textContent = formatTime(media.currentTime);
                durationDisplay.textContent = formatTime(media.duration);
            }

            media.addEventListener('timeupdate', updateProgress);
            media.addEventListener('loadedmetadata', () => {
                durationDisplay.textContent = formatTime(media.duration);
            });
            media.addEventListener('play', () => {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            });
            media.addEventListener('pause', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            });
            media.addEventListener('ended', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                progressFill.style.width = '0%';
                currentTimeDisplay.textContent = '0:00';
            });

            playBtn.addEventListener('click', () => {
                if (media.paused) media.play();
                else media.pause();
            });

            progressBar.addEventListener('click', (e) => {
                const rect = progressBar.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                if (media.duration) {
                    media.currentTime = x * media.duration;
                }
            });

            volumeSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                media.volume = val;
                updateVolumeIcon(val);
            });

            volIcon.addEventListener('click', () => {
                if (media.muted) {
                    media.muted = false;
                    volumeSlider.value = media.volume;
                } else {
                    media.muted = true;
                    volumeSlider.value = 0;
                }
                updateVolumeIcon(media.muted ? 0 : media.volume);
            });

            function updateVolumeIcon(val) {
                if (val === 0 || media.muted) {
                    volIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else if (val < 0.5) {
                    volIcon.innerHTML = '<i class="fas fa-volume-down"></i>';
                } else {
                    volIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            }
            volumeSlider.value = media.volume || 1;
            updateVolumeIcon(media.volume);

            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                } else {
                    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                }
            });

            // Горячие клавиши
            const keyHandler = (e) => {
                if (!document.getElementById('modalOverlay').classList.contains('active')) return;
                if (e.target.tagName === 'INPUT') return;
                switch (e.key) {
                    case ' ':
                        e.preventDefault();
                        if (media.paused) media.play();
                        else media.pause();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        media.currentTime = Math.min(media.currentTime + 5, media.duration || 0);
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        media.currentTime = Math.max(media.currentTime - 5, 0);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        media.volume = Math.min(1, media.volume + 0.1);
                        volumeSlider.value = media.volume;
                        updateVolumeIcon(media.volume);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        media.volume = Math.max(0, media.volume - 0.1);
                        volumeSlider.value = media.volume;
                        updateVolumeIcon(media.volume);
                        break;
                    case 'f':
                    case 'F':
                        e.preventDefault();
                        if (!document.fullscreenElement) {
                            wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                        } else {
                            document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                        }
                        break;
                }
            };
            document.addEventListener('keydown', keyHandler);
            media._keyHandler = keyHandler;

            // Показывать контролы по клику на wrapper
            wrapper.addEventListener('click', () => {
                const controls = document.querySelector('.custom-controls');
                controls.classList.toggle('show');
                setTimeout(() => controls.classList.remove('show'), 3000);
            });
        }

        // ===== ЗАКРЫТИЕ МОДАЛКИ =====
        function closePreview() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            const container = document.getElementById('playerContainer');

            content.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('active');
                content.classList.remove('closing');
                document.body.style.overflow = '';
                if (currentPlayer) {
                    currentPlayer.pause();
                    currentPlayer.currentTime = 0;
                    if (currentPlayer._keyHandler) {
                        document.removeEventListener('keydown', currentPlayer._keyHandler);
                        delete currentPlayer._keyHandler;
                    }
                    currentPlayer = null;
                }
                container.innerHTML = '';
                document.querySelector('.custom-controls').style.display = 'flex';
                document.getElementById('playerWrapper').style.aspectRatio = '16/9';
                document.getElementById('imageFullscreenBtn').style.display = 'none';
                currentImageElement = null;
            }, 200);
        }

        // ===== СОБЫТИЯ =====

        // Темы
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => setTheme(btn.dataset.theme));
        });
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        // Неон интенсивность
        const neonRange = document.getElementById('neonIntensity');
        const savedIntensity = parseInt(localStorage.getItem('neonIntensity')) || 100;
        setNeonIntensity(savedIntensity);
        neonRange.value = savedIntensity;
        neonRange.addEventListener('input', (e) => setNeonIntensity(parseInt(e.target.value)));

        // Неон цвет – пресеты
        document.querySelectorAll('.preset-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                const color = dot.dataset.color;
                setNeonColor(color);
            });
        });
        // Неон цвет – пикер
        document.getElementById('neonColorPicker').addEventListener('input', (e) => {
            setNeonColor(e.target.value);
        });
        // Сброс цвета неона
        document.getElementById('resetNeonColor').addEventListener('click', () => {
            const defaultColor = '#a78bfa';
            setNeonColor(defaultColor);
        });
        // Восстановить сохранённый цвет неона
        const savedNeonColor = localStorage.getItem('neonColor') || '#a78bfa';
        setNeonColor(savedNeonColor);

        // Акцентный цвет
        const accentInput = document.getElementById('accentColor');
        const savedAccent = localStorage.getItem('accentColor') || '#2563eb';
        setAccentColor(savedAccent);
        accentInput.value = savedAccent;
        accentInput.addEventListener('input', (e) => setAccentColor(e.target.value));

        // Метаданные
        document.getElementById('toggleMetaBtn').addEventListener('click', () => {
            showMeta = !showMeta;
            document.getElementById('toggleMetaBtn').innerHTML = showMeta ?
                '<i class="fas fa-eye"></i> Метаданные' :
                '<i class="fas fa-eye-slash"></i> Метаданные';
            renderFiles();
        });

        // Сортировка
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const sort = btn.dataset.sort;
                if (currentSort === sort) {
                    sortAsc = !sortAsc;
                } else {
                    currentSort = sort;
                    sortAsc = true;
                }
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                btn.textContent = btn.textContent.replace(/[▲▼]/, '') + (sortAsc ? ' ▲' : ' ▼');
                renderFiles();
            });
        });

        // Фильтры
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderFiles();
            });
        });

        // Поиск
        document.getElementById('search').addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase().trim();
            renderFiles();
        });

        // Модалка (закрытие)
        document.getElementById('modalClose').addEventListener('click', closePreview);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closePreview();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePreview();
        });

        // ===== СТАРТ =====
        renderFiles();
    </script>
</body>
</html>
