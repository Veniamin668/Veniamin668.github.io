<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив файлов</title>
    <style>
        :root {
            --glow-color: #3b82f6;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -0.025em;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        /* Поле поиска в стиле Glassmorphism */
        .search-box {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 1rem;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .search-box:focus {
            border-color: var(--glow-color);
            background: rgba(30, 41, 59, 0.6);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.25), inset 0 0 10px rgba(59, 130, 246, 0.1);
        }

        .search-box::placeholder {
            color: #64748b;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Элементы списка с эффектом размытия и анимацией hover */
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 16px 24px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .file-item:hover {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(59, 130, 246, 0.1);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .file-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
        }

        .file-name {
            font-weight: 500;
            color: #e2e8f0;
            text-decoration: none;
            word-break: break-all;
            font-size: 0.95rem;
            transition: color 0.15s ease;
        }

        .file-item:hover .file-name {
            color: #60a5fa;
        }

        .file-size {
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 500;
        }

        /* Современная минималистичная кнопка */
        .download-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: all 0.15s ease;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transform: scale(1.03);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35), 0 0 12px rgba(59, 130, 246, 0.2);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-style: italic;
            background: rgba(30, 41, 59, 0.2);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Архив компонентов</h1>
        
        <input type="text" id="search" class="search-box" placeholder="Поиск файлов по названию...">

        <ul class="file-list" id="fileList"></ul>
    </div>

    <script>
        const BASE_URL = 'https://veniamin668.github.io/files/';

        // Сюда автоматика гитхаба будет прописывать структурированные объекты
        const fileData = [
            {"name": "ARch-on-unisoc.png", "size": "126.5 КБ"},
            {"name": "BFTSetup1.7.exe", "size": "31.9 МБ"},
            {"name": "BoosterX.exe", "size": "37.8 МБ"},
            {"name": "Explorer++.exe", "size": "3.9 МБ"},
            {"name": "flux-setup.exe", "size": "673.3 КБ"},
            {"name": "kuro_ax_build_1028[EXTREME].zip", "size": "9.4 МБ"},
            {"name": "LAN_Atheros_1.0.0.29.zip", "size": "4.6 МБ"},
            {"name": "lk-garden_Q.img", "size": "1.3 МБ"},
            {"name": "magisk-v28.1.zip", "size": "11.2 МБ"},
            {"name": "mark.via.gp-20260410.apk", "size": "4.0 МБ"},
            {"name": "MAS_AIO.cmd", "size": "725.3 КБ"},
            {"name": "MikuWallpapers.apk", "size": "25.9 МБ"},
            {"name": "MIO-KITCHEN-4.1.9-win.7z", "size": "97.9 МБ"},
            {"name": "mitigations-check.txt", "size": "0.1 КБ"},
            {"name": "npp.8.9.6.4.Installer.x64.exe", "size": "6.6 МБ"},
            {"name": "OOSU10.exe", "size": "76.1 МБ"},
            {"name": "RadeonMod.zip", "size": "676.5 КБ"},
            {"name": "README.md", "size": "3.7 КБ"},
            {"name": "Redact-Setup.exe", "size": "65.9 МБ"},
            {"name": "server.bat", "size": "0.3 КБ"},
            {"name": "test.txt", "size": "0.0 КБ"},
            {"name": "TgWsProxy_windows.exe", "size": "20.0 МБ"},
            {"name": "ultra_opt.bat", "size": "4.7 КБ"},
            {"name": "UNISOC_GENERAL_LICENSE_V1.0-EN_US", "size": "7.1 КБ"},
            {"name": "unisuck-logo.txt", "size": "0.0 КБ"},
            {"name": "vibranceGUI.exe", "size": "776.0 КБ"},
            {"name": "WinNTSetup.zip", "size": "3.4 МБ"},
            {"name": "winutil.ps1", "size": "569.0 КБ"},
            {"name": "zapret_module.zip", "size": "367.8 КБ"},
            {"name": "Zapret2Setup_21_1_1_2.exe", "size": "32.5 МБ"},
            {"name": "Zed-x86_64.exe", "size": "81.4 МБ"},
            {"name": "zen-mods-export.json", "size": "8.4 КБ"},
            {"name": "zen.installer.exe", "size": "90.3 МБ"}
        ];

        function getIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return '📦';
            if (['exe', 'msi'].includes(ext)) return '⚙️';
            if (['apk'].includes(ext)) return '🤖';
            if (['img', 'iso'].includes(ext)) return '💾';
            if (['ps1', 'bat', 'sh', 'cmd'].includes(ext)) return '📜';
            if (['json', 'xml', 'txt', 'md'].includes(ext)) return '📄';
            if (['png', 'jpg', 'jpeg', 'gif', 'svg'].includes(ext)) return '🖼️';
            return '📁';
        }

        function renderFiles(list) {
            const listElement = document.getElementById('fileList');
            listElement.innerHTML = '';

            if (list.length === 0) {
                listElement.innerHTML = `<div class="no-results">Совпадений не найдено</div>`;
                return;
            }

            list.forEach(file => {
                const fileUrl = BASE_URL + file.name;
                const icon = getIcon(file.name);

                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon">${icon}</span>
                        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                            <a href="${fileUrl}" class="file-name" download>${file.name}</a>
                            <span class="file-size">Размер: ${file.size}</span>
                        </div>
                    </div>
                    <a href="${fileUrl}" class="download-btn" download>Скачать</a>
                `;
                listElement.appendChild(li);
            });
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = fileData.filter(file => file.name.toLowerCase().includes(query));
            renderFiles(filtered);
        });

        renderFiles(fileData);
    </script>

</body>
</html>
