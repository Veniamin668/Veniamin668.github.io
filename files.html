<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Архив файлов" />
    <meta property="og:description" content="Коллекция полезных файлов разработчика" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://veniamin668.github.io/files.html" />
    <meta property="og:image" content="https://veniamin668.github.io/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <style>
        /* ===== ТВОЙ БЭКАП (ПОЛНОСТЬЮ) ===== */
        /* Тут все стили из твоего бэкапа – я их не меняю, только дополняю внизу */

        /* ===== ДОПОЛНЕНИЯ ДЛЯ ЭКВАЛАЙЗЕРА, СТАТИСТИКИ И АНИМАЦИИ ===== */
        .equalizer-canvas {
            position: absolute;
            bottom: 70px;
            left: 0;
            right: 0;
            height: 60px;
            width: 100%;
            pointer-events: none;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .player-wrapper:hover .equalizer-canvas,
        .equalizer-canvas.show {
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stats-card {
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        .stats-card h3 {
            margin: 0 0 12px;
            color: var(--text-secondary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-card canvas {
            max-height: 200px;
            max-width: 100%;
        }
        .stats-summary {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .stats-summary .stat-item {
            background: var(--bg-item);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 120px;
            text-align: center;
        }
        .stats-summary .stat-item .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            display: block;
        }
        .stats-summary .stat-item .label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Анимация появления файлов */
        .file-item {
            animation: slideUp 0.3s ease forwards;
            opacity: 0;
        }
        .file-item:nth-child(1) { animation-delay: 0.02s; }
        .file-item:nth-child(2) { animation-delay: 0.04s; }
        .file-item:nth-child(3) { animation-delay: 0.06s; }
        .file-item:nth-child(4) { animation-delay: 0.08s; }
        .file-item:nth-child(5) { animation-delay: 0.10s; }
        .file-item:nth-child(6) { animation-delay: 0.12s; }
        .file-item:nth-child(7) { animation-delay: 0.14s; }
        .file-item:nth-child(8) { animation-delay: 0.16s; }
        .file-item:nth-child(9) { animation-delay: 0.18s; }
        .file-item:nth-child(10) { animation-delay: 0.20s; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                tabStats: 'Статистика',
                noResults: 'Совпадений не найдено',

                searchPlaceholder: '🔍 Search files by name...',

                tabStats: 'Statistics',
                noResults: 'No matches found',
                statsTotal: 'Total files',
                statsTypes: 'File types',
                statsLastUpdated: 'Last updated',
                statsByType: 'By type',
                statsByExt: 'By extension',
                metaToggle: 'Metadata',
                sortLabel: 'Sort:',
                editorTitle: 'Editing:',
                editorDownload: 'Download modified',
                editorClose: 'Close',
            }
        };

        // ===== БАЗОВЫЕ ПЕРЕМЕННЫЕ =====
        const BASE_URL = 'https://veniamin668.github.io/files/';
        const fileData = [
            // FILE_DATA_PLACEHOLDER
        ];

        let currentFilter = 'all';
        let currentSearch = '';
        let showMeta = true;
        let currentSort = 'name';
        let sortAsc = true;
        let currentPlayer = null;
        let chartsInitialized = false;
        let currentLang = localStorage.getItem('lang') || 'ru';
        let audioCtx = null;
        let analyser = null;
        let animationId = null;

        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (ТВОЙ БЭКАП) =====
        function getIcon(file) { /* ... (полный код из бэкапа) */ }
        function formatDuration(sec) { /* ... */ }
        function formatSize(bytes) { /* ... */ }
        function getFileSizeBytes(sizeStr) { /* ... */ }
        function renderMetadata(file) { /* ... */ }
        function sortFiles(list) { /* ... */ }
        function getFilteredData() { /* ... */ }
        function updateStats(list) { /* ... */ }

        // ===== ФУНКЦИЯ ПЕРЕКЛЮЧЕНИЯ ЯЗЫКА (ТВОЙ БЭКАП) =====
        function setLanguage(lang) { /* ... */ }

        // ===== ТЕМЫ, НЕОН, ПРЕСЕТЫ (ТВОЙ БЭКАП) =====
        function setTheme(theme) { /* ... */ }
        function setNeonIntensity(value) { /* ... */ }
        function setNeonColor(color) { /* ... */ }

        const themePresets = { /* ... */ };

        // ===== РЕНДЕР СПИСКА (ТВОЙ БЭКАП) =====
        function renderFiles() {
            const list = getFilteredData();
            const container = document.getElementById('fileList');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div class="no-results"><i class="fas fa-search"></i> ${translations[currentLang].noResults}</div>`;
                updateStats([]);
                return;
            }
            list.forEach(file => {
                const url = BASE_URL + file.name;
                const icon = getIcon(file);
                const meta = renderMetadata(file);
                const canPreview = ['image','video','audio'].includes(file.type);
                const isText = /\.(txt|md|json|xml|yaml|yml|csv|log|sh|bat|ps1)$/i.test(file.name);

                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon"><i class="fas ${icon}"></i></span>
                        <div class="file-details">
                            <a href="${url}" class="file-name" download>${file.name}</a>
                            <div class="file-meta ${showMeta ? '' : 'hidden'}">
                                <span><i class="fas fa-weight-hanging"></i> ${file.size}</span>
                                ${meta}
                            </div>
                        </div>
                    </div>
                    <div class="file-actions">
                        ${canPreview ? `<button class="btn btn-preview" data-url="${url}" data-name="${file.name}" data-type="${file.type}"><i class="fas fa-eye"></i> ${translations[currentLang].view}</button>` : ''}
                        ${isText ? `<button class="btn btn-edit" data-url="${url}" data-name="${file.name}"><i class="fas fa-edit"></i></button>` : ''}
                        <button class="btn btn-copy" data-url="${url}" title="${translations[currentLang].copy}"><i class="fas fa-link"></i></button>
                        <a href="${url}" class="btn btn-newtab" target="_blank" title="${translations[currentLang].openTab}"><i class="fas fa-external-link-alt"></i></a>
                        <a href="${url}" class="btn btn-download" download><i class="fas fa-download"></i> ${translations[currentLang].download}</a>
                    </div>
                `;
                container.appendChild(li);
            });

            document.querySelectorAll('.btn-preview').forEach(btn => {
                btn.addEventListener('click', () => openPreview(btn.dataset.url, btn.dataset.name, btn.dataset.type));
            });
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => openEditor(btn.dataset.url, btn.dataset.name));
            });
            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(btn.dataset.url).then(() => {
                        btn.innerHTML = '<i class="fas fa-check"></i>';
                        setTimeout(() => btn.innerHTML = '<i class="fas fa-link"></i>', 2000);
                    });
                });
            });

            updateStats(list);
        }

        // ===== ОТКРЫТИЕ ПРЕДПРОСМОТРА (ТВОЙ БЭКАП + ДОБАВЛЕН ЭКВАЛАЙЗЕР) =====
        function openPreview(url, name, type) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
                <div class="player-wrapper" id="playerWrapper">
                    <div id="playerContainer" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
                    <canvas class="equalizer-canvas" id="equalizerCanvas"></canvas>
                    <div class="custom-controls" id="customControls">
                        <div class="controls-row">
                            <button class="btn-ctrl" id="playBtn"><i class="fas fa-play"></i></button>
                            <div class="progress-container">
                                <span class="progress-time" id="currentTimeDisplay">0:00</span>
                                <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                                <span class="progress-time" id="durationDisplay">0:00</span>
                            </div>
                            <div class="volume-control">
                                <span class="vol-icon" id="volIcon"><i class="fas fa-volume-up"></i></span>
                                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
                            </div>
                            <button class="fullscreen-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
                        </div>
                    </div>
                    <div class="pizza-spinner" id="pizzaSpinner">🍕</div>
                </div>
                <div class="modal-filename" id="modalFilename">${name}</div>
            `;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            const wrapper = document.getElementById('playerWrapper');
            const mediaContainer = document.getElementById('playerContainer');
            const spinner = document.getElementById('pizzaSpinner');
            const equalizerCanvas = document.getElementById('equalizerCanvas');

            const closeHandler = () => closeModal();
            document.getElementById('modalClose').addEventListener('click', closeHandler);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeHandler(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHandler(); });

            if (type === 'image') {
                // === ФОТО (ТВОЙ БЭКАП) ===
                const img = document.createElement('img');
                img.src = url;
                img.style.maxWidth = '90vw';
                img.style.maxHeight = '80vh';
                img.style.borderRadius = '12px';
                img.style.objectFit = 'contain';
                mediaContainer.appendChild(img);
                const fsBtn = document.createElement('button');
                fsBtn.className = 'image-fullscreen-btn';
                fsBtn.innerHTML = '<i class="fas fa-expand"></i>';
                fsBtn.style.display = 'flex';
                fsBtn.onclick = () => {
                    if (!document.fullscreenElement) wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                    else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                };
                wrapper.appendChild(fsBtn);
                document.querySelector('.custom-controls').style.display = 'none';
                spinner.style.display = 'none';
                equalizerCanvas.style.display = 'none';
                return;
            }

            // === ВИДЕО / АУДИО ===
            let media;
            if (type === 'video') {
                media = document.createElement('video');
                media.setAttribute('playsinline', '');
            } else {
                media = document.createElement('audio');
            }
            media.src = url;
            media.controls = false;
            media.style.width = '100%';
            media.style.height = '100%';
            media.style.display = 'block';
            media.style.background = '#000';
            mediaContainer.appendChild(media);
            currentPlayer = media;

            // === ЭКВАЛАЙЗЕР (только для аудио) ===
            if (type === 'audio') {
                const canvas = document.getElementById('equalizerCanvas');
                canvas.style.display = 'block';
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.clientWidth || 600;
                canvas.height = 60;

                function setupAudio() {
                    if (audioCtx) return;
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    const source = audioCtx.createMediaElementSource(media);
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    const dataArray = new Uint8Array(analyser.frequencyBinCount);

                    function drawEqualizer() {
                        if (!analyser) return;
                        analyser.getByteFrequencyData(dataArray);
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const barWidth = (canvas.width / dataArray.length) * 2.5;
                        let x = 0;
                        for (let i = 0; i < dataArray.length; i++) {
                            const value = dataArray[i];
                            const percent = value / 255;
                            const height = percent * canvas.height;
                            ctx.fillStyle = `hsl(${200 - percent * 40}, 80%, 50%)`;
                            ctx.fillRect(x, canvas.height - height, barWidth - 1, height);
                            x += barWidth;
                        }
                        animationId = requestAnimationFrame(drawEqualizer);
                    }
                    drawEqualizer();
                }

                media.addEventListener('play', () => {
                    if (!audioCtx) setupAudio();
                });
                media.addEventListener('pause', () => {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                });
            } else {
                document.getElementById('equalizerCanvas').style.display = 'none';
            }

            // === КОНТРОЛЫ ПЛЕЕРА (ТВОЙ БЭКАП) ===
            const playBtn = document.getElementById('playBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            const volumeSlider = document.getElementById('volumeSlider');
            const volIcon = document.getElementById('volIcon');
            const fullscreenBtn = document.getElementById('fullscreenBtn');

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const h = Math.floor(seconds/3600);
                const m = Math.floor((seconds%3600)/60);
                const s = Math.floor(seconds%60);
                if (h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                return `${m}:${String(s).padStart(2,'0')}`;
            }

            function updateProgress() {
                if (!media) return;
                const percent = media.duration ? (media.currentTime/media.duration)*100 : 0;
                progressFill.style.width = percent + '%';
                currentTimeDisplay.textContent = formatTime(media.currentTime);
                durationDisplay.textContent = formatTime(media.duration);
            }

            media.addEventListener('timeupdate', updateProgress);
            media.addEventListener('loadedmetadata', () => durationDisplay.textContent = formatTime(media.duration));
            media.addEventListener('play', () => playBtn.innerHTML = '<i class="fas fa-pause"></i>');
            media.addEventListener('pause', () => playBtn.innerHTML = '<i class="fas fa-play"></i>');
            media.addEventListener('ended', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                progressFill.style.width = '0%';
                currentTimeDisplay.textContent = '0:00';
            });

            playBtn.addEventListener('click', () => media.paused ? media.play() : media.pause());
            progressBar.addEventListener('click', (e) => {
                const rect = progressBar.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                if (media.duration) media.currentTime = x * media.duration;
            });
            volumeSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                media.volume = val;
                updateVolumeIcon(val);
            });
            volIcon.addEventListener('click', () => {
                if (media.muted) { media.muted = false; volumeSlider.value = media.volume; }
                else { media.muted = true; volumeSlider.value = 0; }
                updateVolumeIcon(media.muted ? 0 : media.volume);
            });
            function updateVolumeIcon(val) {
                if (val === 0 || media.muted) volIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
                else if (val < 0.5) volIcon.innerHTML = '<i class="fas fa-volume-down"></i>';
                else volIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
            }
            volumeSlider.value = media.volume || 1;
            updateVolumeIcon(media.volume);

            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            });

            // Горячие клавиши
            const keyHandler = (e) => {
                if (!overlay.classList.contains('active')) return;
                if (e.target.tagName === 'INPUT') return;
                switch (e.key) {
                    case ' ': e.preventDefault(); media.paused ? media.play() : media.pause(); break;
                    case 'ArrowRight': e.preventDefault(); media.currentTime = Math.min(media.currentTime + 5, media.duration || 0); break;
                    case 'ArrowLeft': e.preventDefault(); media.currentTime = Math.max(media.currentTime - 5, 0); break;
                    case 'ArrowUp': e.preventDefault(); media.volume = Math.min(1, media.volume + 0.1); volumeSlider.value = media.volume; updateVolumeIcon(media.volume); break;
                    case 'ArrowDown': e.preventDefault(); media.volume = Math.max(0, media.volume - 0.1); volumeSlider.value = media.volume; updateVolumeIcon(media.volume); break;
                    case 'f': case 'F': e.preventDefault(); fullscreenBtn.click(); break;
                }
            };
            document.addEventListener('keydown', keyHandler);
            media._keyHandler = keyHandler;

            const navHandler = (e) => {
                if (!overlay.classList.contains('active')) return;
                if (e.target.tagName === 'INPUT') return;
                const list = getFilteredData();
                const idx = list.findIndex(f => f.name === name);
                if (e.key === 'j' || e.key === 'J') {
                    e.preventDefault();
                    const next = list[(idx + 1) % list.length];
                    if (next) openPreview(BASE_URL + next.name, next.name, next.type);
                } else if (e.key === 'k' || e.key === 'K') {
                    e.preventDefault();
                    const prev = list[(idx - 1 + list.length) % list.length];
                    if (prev) openPreview(BASE_URL + prev.name, prev.name, prev.type);
                }
            };
            document.addEventListener('keydown', navHandler);
            media._navHandler = navHandler;

            media.play().catch(() => {});
        }

        // ===== РЕДАКТОР (ТВОЙ БЭКАП) =====
        function openEditor(url, name) { /* ... */ }

        // ===== ЗАКРЫТИЕ МОДАЛКИ (ТВОЙ БЭКАП) =====
        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            content.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('active');
                content.classList.remove('closing');
                document.body.style.overflow = '';
                if (currentPlayer) {
                    currentPlayer.pause();
                    currentPlayer.currentTime = 0;
                    if (currentPlayer._keyHandler) document.removeEventListener('keydown', currentPlayer._keyHandler);
                    if (currentPlayer._navHandler) document.removeEventListener('keydown', currentPlayer._navHandler);
                    if (audioCtx) {
                        audioCtx.close();
                        audioCtx = null;
                        analyser = null;
                        if (animationId) {
                            cancelAnimationFrame(animationId);
                            animationId = null;
                        }
                    }
                    currentPlayer = null;
                }
                content.innerHTML = '';
            }, 200);
        }

        // ===== СТАТИСТИКА (УЛУЧШЕННАЯ) =====
        function initStats() {
            if (chartsInitialized) return;
            const list = fileData;
            const total = list.length;
            let totalBytes = 0;
            const typeCount = {};
            const extCount = {};
            const dateCount = {};
            const sizeBuckets = { '<1KB':0, '1KB-100KB':0, '100KB-1MB':0, '1MB-10MB':0, '10MB-100MB':0, '>100MB':0 };
            let lastModified = 0;

            list.forEach(f => {
                const bytes = getFileSizeBytes(f.size);
                totalBytes += bytes;
                const t = f.type || 'other';
                typeCount[t] = (typeCount[t] || 0) + 1;
                const ext = f.name.split('.').pop().toLowerCase();
                extCount[ext] = (extCount[ext] || 0) + 1;
                if (f.modified) {
                    const d = new Date(f.modified).toISOString().split('T')[0];
                    dateCount[d] = (dateCount[d] || 0) + 1;
                }
                if (bytes < 1024) sizeBuckets['<1KB']++;
                else if (bytes < 1024*100) sizeBuckets['1KB-100KB']++;
                else if (bytes < 1048576) sizeBuckets['100KB-1MB']++;
                else if (bytes < 10485760) sizeBuckets['1MB-10MB']++;
                else if (bytes < 104857600) sizeBuckets['10MB-100MB']++;
                else sizeBuckets['>100MB']++;

                const m = new Date(f.modified || 0).getTime();
                if (m > lastModified) lastModified = m;
            });

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statSize').textContent = formatSize(totalBytes);
            document.getElementById('statTypes').textContent = Object.keys(typeCount).length;
            document.getElementById('statLastUpdated').textContent = lastModified ? new Date(lastModified).toLocaleString() : '—';

            // Круговая
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            const typeLabels = Object.keys(typeCount);
            const typeData = typeLabels.map(k => typeCount[k]);
            const colors = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#6b7280'];
            new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: typeLabels.map(l => l.charAt(0).toUpperCase() + l.slice(1)),
                    datasets: [{ data: typeData, backgroundColor: colors.slice(0, typeData.length), borderColor: 'var(--bg-item)', borderWidth: 2 }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: 'var(--text-muted)' } }
                    }
                }
            });

            // Гистограмма расширений
            const ctxBar = document.getElementById('barChart').getContext('2d');
            const sortedExts = Object.entries(extCount).sort((a,b) => b[1] - a[1]).slice(0,10);
            const barLabels = sortedExts.map(e => e[0]);
            const barData = sortedExts.map(e => e[1]);
            new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: barLabels,
                    datasets: [{ label: 'Количество файлов', data: barData, backgroundColor: 'var(--accent)', borderRadius: 4 }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: 'var(--text-muted)', stepSize: 1 } },
                        x: { ticks: { color: 'var(--text-muted)' } }
                    }
                }
            });

            // Линейный график по датам
            const ctxLine = document.getElementById('lineChart').getContext('2d');
            const dates = Object.keys(dateCount).sort();
            const dateValues = dates.map(d => dateCount[d]);
            new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Файлов добавлено',
                        data: dateValues,
                        borderColor: 'var(--accent)',
                        backgroundColor: 'rgba(37,99,235,0.1)',
                        fill: true,
                        tension: 0.1,
                        pointBackgroundColor: 'var(--accent)',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: 'var(--text-muted)', stepSize: 1 } },
                        x: { ticks: { color: 'var(--text-muted)', maxRotation: 45, autoSkip: true, maxTicksLimit: 15 } }
                    }
                }
            });

            // Гистограмма размеров
            const ctxSize = document.getElementById('sizeHistogram').getContext('2d');
            const sizeLabels = Object.keys(sizeBuckets);
            const sizeData = sizeLabels.map(k => sizeBuckets[k]);
            new Chart(ctxSize, {
                type: 'bar',
                data: {
                    labels: sizeLabels,
                    datasets: [{
                        label: 'Количество файлов',
                        data: sizeData,
                        backgroundColor: 'rgba(37,99,235,0.6)',
                        borderColor: 'var(--accent)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: 'var(--text-muted)', stepSize: 1 } },
                        x: { ticks: { color: 'var(--text-muted)' } }
                    }
                }
            });

            chartsInitialized = true;
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (ТВОЙ БЭКАП) =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'stats') initStats();
            });
        });

        // ===== ИНИЦИАЛИЗАЦИЯ (ТВОЙ БЭКАП) =====
        // Темы
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => setTheme(btn.dataset.theme));
        });
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        // Неон интенсивность
        const neonRange = document.getElementById('neonIntensity');
        const savedIntensity = parseInt(localStorage.getItem('neonIntensity')) || 100;
        setNeonIntensity(savedIntensity);
        neonRange.value = savedIntensity;
        neonRange.addEventListener('input', (e) => setNeonIntensity(parseInt(e.target.value)));

        // Неон цвет
        document.querySelectorAll('.preset-dot').forEach(dot => {
            dot.addEventListener('click', () => setNeonColor(dot.dataset.color));
        });
        document.getElementById('neonColorPicker').addEventListener('input', (e) => setNeonColor(e.target.value));
        document.getElementById('resetNeonColor').addEventListener('click', () => setNeonColor('#a78bfa'));
        const savedNeonColor = localStorage.getItem('neonColor') || '#a78bfa';
        setNeonColor(savedNeonColor);

        // Акцент
        const accentInput = document.getElementById('accentColor');
        const savedAccent = localStorage.getItem('accentColor') || '#2563eb';
        setAccentColor(savedAccent);
        accentInput.value = savedAccent;
        accentInput.addEventListener('input', (e) => setAccentColor(e.target.value));

        // Пресеты тем
        document.querySelectorAll('.theme-preset-btn').forEach(btn => {
            btn.addEventListener('click', () => applyThemePreset(btn.dataset.themePreset));
        });
        const savedPreset = localStorage.getItem('themePreset');
        if (savedPreset) applyThemePreset(savedPreset);

        // Метаданные
        document.getElementById('toggleMetaBtn').addEventListener('click', () => {
            showMeta = !showMeta;
            const btn = document.getElementById('toggleMetaBtn');
            btn.innerHTML = `<i class="fas fa-eye"></i> ${translations[currentLang].metaToggle}`;
            renderFiles();
        });

        // Сортировка
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const sort = btn.dataset.sort;
                if (currentSort === sort) sortAsc = !sortAsc;
                else { currentSort = sort; sortAsc = true; }
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const arrow = sortAsc ? ' ▲' : ' ▼';
                const key = btn.dataset.i18n;
                const label = translations[currentLang][key] || btn.textContent.replace(/[▲▼]/, '');
                btn.textContent = label + arrow;
                renderFiles();
            });
        });

        // Фильтры
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderFiles();
            });
        });

        // Поиск
        document.getElementById('search').addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase().trim();
            renderFiles();
        });

        // Язык
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });
        const browserLang = navigator.language.slice(0,2);
        const defaultLang = ['ru', 'en'].includes(browserLang) ? browserLang : 'ru';
        currentLang = localStorage.getItem('lang') || defaultLang;
        setLanguage(currentLang);

        // Закрытие модалки по Escape (уже есть в closeModal, но добавим глобально)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('active')) {
                closeModal();
            }
        });

        // ===== СТАРТ =====
        renderFiles();
        if (document.querySelector('.tab-btn.active').dataset.tab === 'stats') initStats();
    </script>
</body>
</html>
