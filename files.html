<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив файлов</title>
    <meta property="og:title" content="Архив файлов">
    <meta property="og:description" content="Коллекция полезных файлов разработчика">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://veniamin668.github.io/files.html">
    <meta property="og:image" content="https://veniamin668.github.io/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ===== БАЗОВЫЕ ПЕРЕМЕННЫЕ ===== */
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            --bg-item: rgba(30,41,59,0.4);
            --bg-item-hover: rgba(30,41,59,0.7);
            --bg-search: rgba(30,41,59,0.4);
            --bg-modal: rgba(15,23,42,0.9);
            --text-primary: #f1f5f9;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border-color: rgba(255,255,255,0.05);
            --shadow-color: rgba(0,0,0,0.3);
            --btn-preview-bg: rgba(255,255,255,0.08);
            --btn-preview-hover: rgba(255,255,255,0.18);
            --glow-start: rgba(245,87,108,0.2);
            --glow-end: rgba(79,172,254,0.6);
            --modal-overlay: rgba(0,0,0,0.75);
            --accent: #2563eb;
            --accent-hover: #3b82f6;
            --accent-glow: rgba(37,99,235,0.3);
            --neon-intensity: 1;
            --neon-color: #a78bfa;
            --neon-glow: rgba(167,139,250,0.3);
        }
        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #f0f4ff 0%, #d9e2ef 70%);
            --bg-item: rgba(255,255,255,0.6);
            --bg-item-hover: rgba(255,255,255,0.85);
            --bg-search: rgba(255,255,255,0.6);
            --bg-modal: rgba(255,255,255,0.95);
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #475569;
            --text-dim: #64748b;
            --border-color: rgba(0,0,0,0.08);
            --shadow-color: rgba(0,0,0,0.1);
            --btn-preview-bg: rgba(0,0,0,0.06);
            --btn-preview-hover: rgba(0,0,0,0.12);
            --glow-start: rgba(245,87,108,0.3);
            --glow-end: rgba(79,172,254,0.5);
            --modal-overlay: rgba(0,0,0,0.5);
            --neon-color: #7c3aed;
            --neon-glow: rgba(124,58,237,0.15);
        }
        [data-theme="neon"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0b0e1a 0%, #1a0b2e 70%);
            --bg-item: rgba(20,10,40,0.5);
            --bg-item-hover: rgba(40,20,80,0.7);
            --bg-search: rgba(20,10,40,0.5);
            --bg-modal: rgba(10,5,25,0.95);
            --text-primary: #e8daff;
            --text-secondary: #d4bfff;
            --text-muted: #b090e0;
            --text-dim: #8060b0;
            --border-color: rgba(180,120,255,0.25);
            --shadow-color: rgba(120,80,255,0.3);
            --btn-preview-bg: rgba(180,120,255,0.12);
            --btn-preview-hover: rgba(180,120,255,0.25);
            --glow-start: rgba(200,100,255,0.5);
            --glow-end: rgba(100,200,255,0.7);
            --modal-overlay: rgba(0,0,0,0.85);
            --neon-color: #a78bfa;
            --neon-glow: rgba(167,139,250,0.3);
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }
        .container { width:100%; max-width:900px; }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .glow-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin:0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, var(--neon-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--glow-start);
            animation: glow 3s ease-in-out infinite alternate;
            letter-spacing: -0.02em;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px var(--glow-start); }
            to { text-shadow: 0 0 40px var(--glow-end), 0 0 60px var(--glow-end); }
        }
        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .theme-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 14px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-btn:hover { background: var(--bg-item-hover); transform: scale(1.05); }
        .theme-btn.active { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .lang-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-item);
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .lang-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 20px;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .lang-btn:hover { color: var(--text-secondary); }
        .lang-btn.active { background: var(--accent); color: #fff; }
        .neon-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-item);
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .neon-control label { font-size:0.8rem; color:var(--text-muted); display:flex; align-items:center; gap:4px; }
        .neon-control input[type="range"] {
            width:80px; height:4px; -webkit-appearance:none; background:var(--accent); border-radius:2px; outline:none; cursor:pointer;
        }
        .neon-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid var(--text-primary); box-shadow:0 0 10px var(--accent-glow); cursor:pointer;
        }
        .neon-control span { font-size:0.75rem; color:var(--text-muted); min-width:28px; text-align:center; }
        .neon-color-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-item);
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .neon-color-picker label { font-size:0.8rem; color:var(--text-muted); }
        .neon-color-picker input[type="color"] {
            width:30px; height:30px; border:none; border-radius:50%; cursor:pointer; background:none; padding:0;
        }
        .neon-color-picker input[type="color"]::-webkit-color-swatch-wrapper { padding:0; }
        .neon-color-picker input[type="color"]::-webkit-color-swatch { border:2px solid var(--border-color); border-radius:50%; }
        .neon-color-presets { display:flex; gap:4px; }
        .preset-dot {
            width:22px; height:22px; border-radius:50%; border:2px solid var(--border-color); cursor:pointer; transition:0.2s;
        }
        .preset-dot:hover { transform:scale(1.15); }
        .preset-dot.active { border-color:#fff; box-shadow:0 0 12px var(--neon-glow); }
        .reset-neon-btn {
            background: var(--btn-preview-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 12px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .reset-neon-btn:hover { background: var(--btn-preview-hover); color: var(--text-secondary); }
        .theme-presets {
            display: flex;
            gap: 6px;
            align-items: center;
            background: var(--bg-item);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .theme-preset-btn {
            width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:0.2s;
        }
        .theme-preset-btn:hover { transform:scale(1.15); }
        .theme-preset-btn.active { border-color:#fff; box-shadow:0 0 12px var(--neon-glow); }

        /* ===== СТАТИСТИКА, ВКЛАДКИ, ФИЛЬТРЫ, ПОИСК ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            justify-content: space-between;
            align-items: center;
        }
        .stats {
            display: flex;
            gap: 25px;
            font-size: 0.95rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .stats span { display:flex; align-items:center; gap:8px; }
        .stats strong { color:var(--text-secondary); }
        .bar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .bar-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .bar-btn:hover { background: var(--bg-item-hover); color: var(--text-secondary); }
        .bar-btn.accent { background: var(--accent); color:#fff; border-color:var(--accent); }
        .bar-btn.accent:hover { background: var(--accent-hover); }

        .tabs {
            display: flex;
            gap: 4px;
            margin: 16px 0 20px;
            background: var(--bg-item);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            flex-wrap: wrap;
        }
        .tab-btn {
            flex:1; min-width:100px; padding:10px 16px; border:none; border-radius:10px; background:transparent; color:var(--text-muted); font-size:0.95rem; font-weight:600; cursor:pointer; transition:0.2s; display:flex; align-items:center; justify-content:center; gap:8px;
        }
        .tab-btn:hover { color:var(--text-secondary); background:var(--btn-preview-hover); }
        .tab-btn.active { background:var(--accent); color:#fff; box-shadow:0 4px 12px var(--accent-glow); }
        .tab-content { display:none; animation:fadeIn 0.3s ease; }
        .tab-content.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stats-card {
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        .stats-card h3 {
            margin:0 0 12px; color:var(--text-secondary); font-size:1rem; display:flex; align-items:center; gap:8px;
        }
        .stats-card canvas { max-height:250px; max-width:100%; }
        .stats-summary {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .stats-summary .stat-item {
            background: var(--bg-item);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            flex:1; min-width:120px; text-align:center;
        }
        .stats-summary .stat-item .number {
            font-size:2rem; font-weight:700; color:var(--accent); display:block;
        }
        .stats-summary .stat-item .label { font-size:0.8rem; color:var(--text-muted); }

        .sort-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .sort-label { font-size:0.85rem; color:var(--text-muted); margin-right:4px; }
        .sort-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 4px 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .sort-btn:hover { background: var(--bg-item-hover); color: var(--text-secondary); }
        .sort-btn.active { background: var(--accent); color:#fff; border-color:var(--accent); }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 16px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .filter-btn:hover { background: var(--bg-item-hover); color: var(--text-secondary); }
        .filter-btn.active { background: var(--accent); color:#fff; border-color:var(--accent); }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 20px;
            background: var(--bg-search);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.25s;
            box-shadow: 0 4px 30px var(--shadow-color);
        }
        .search-box:focus { border-color:var(--accent); box-shadow:0 0 15px var(--accent-glow); }
        .search-box::placeholder { color:var(--text-dim); }

        /* ===== СПИСОК ФАЙЛОВ ===== */
        .file-list { list-style:none; padding:0; margin:0; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-item);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.25s;
            flex-wrap: wrap;
            gap: 10px;
            animation: slideUp 0.3s ease forwards;
            opacity:0;
        }
        .file-item:nth-child(1) { animation-delay: 0.02s; }
        .file-item:nth-child(2) { animation-delay: 0.04s; }
        .file-item:nth-child(3) { animation-delay: 0.06s; }
        .file-item:nth-child(4) { animation-delay: 0.08s; }
        .file-item:nth-child(5) { animation-delay: 0.10s; }
        .file-item:nth-child(6) { animation-delay: 0.12s; }
        .file-item:nth-child(7) { animation-delay: 0.14s; }
        .file-item:nth-child(8) { animation-delay: 0.16s; }
        .file-item:nth-child(9) { animation-delay: 0.18s; }
        .file-item:nth-child(10) { animation-delay: 0.20s; }
        @keyframes slideUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }
        [data-theme="neon"] .file-item {
            box-shadow: 0 0 calc(8px * var(--neon-intensity)) var(--neon-glow), 0 0 calc(20px * var(--neon-intensity)) rgba(0,0,0,0.2);
            border-color: var(--neon-color);
        }
        [data-theme="neon"] .file-item:hover {
            box-shadow: 0 0 calc(15px * var(--neon-intensity)) var(--neon-glow), 0 0 calc(40px * var(--neon-intensity)) rgba(0,0,0,0.2);
            border-color: var(--neon-color);
            transform: translateY(-4px) scale(1.01);
        }
        .file-item:hover {
            transform: translateY(-4px) scale(1.01);
            background: var(--bg-item-hover);
            border-color: var(--accent);
            box-shadow: 0 10px 25px var(--shadow-color);
        }
        .file-info {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            min-width: 0;
            flex: 1;
        }
        .file-icon {
            font-size:1.6rem; flex-shrink:0; margin-top:2px; width:30px; text-align:center; color:var(--text-muted);
        }
        .file-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .file-name {
            font-weight:500; color:var(--text-secondary); text-decoration:none; word-break:break-all; font-size:0.95rem; transition:color 0.15s;
        }
        .file-item:hover .file-name { color:var(--accent); }
        .file-meta {
            font-size:0.78rem; color:var(--text-muted); display:flex; flex-wrap:wrap; gap:6px 16px; transition:opacity 0.2s;
        }
        .file-meta.hidden { opacity:0; height:0; margin:0; overflow:hidden; }
        .file-meta span { display:inline-flex; align-items:center; gap:4px; }
        .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding:6px 14px; border-radius:8px; font-size:0.8rem; font-weight:600; transition:all 0.15s; text-decoration:none; border:1px solid var(--border-color); cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; background:transparent; color:var(--text-secondary);
        }
        .btn-download {
            background: var(--accent); color:#fff; border:none; box-shadow:0 4px 12px var(--accent-glow);
        }
        .btn-download:hover { background: var(--accent-hover); transform:scale(1.05); }
        .btn-preview { background: var(--btn-preview-bg); border-color:var(--border-color); }
        .btn-preview:hover { background: var(--btn-preview-hover); transform:scale(1.05); }
        .btn-newtab { background: var(--btn-preview-bg); border-color:var(--border-color); }
        .btn-newtab:hover { background: var(--btn-preview-hover); transform:scale(1.05); }
        .btn-copy { background: var(--btn-preview-bg); border-color:var(--border-color); }
        .btn-copy:hover { background: var(--btn-preview-hover); transform:scale(1.05); }
        .btn-edit { background: var(--btn-preview-bg); border-color:var(--border-color); }
        .btn-edit:hover { background: var(--btn-preview-hover); transform:scale(1.05); }
        .no-results {
            text-align:center; padding:30px; color:var(--text-dim); font-style:italic; background:var(--bg-item); border-radius:12px; border:1px dashed var(--border-color);
        }

        /* ===== МОДАЛЬНОЕ ОКНО (упрощённое для стабильности) ===== */
        .modal-overlay {
            display:none;
            position:fixed;
            inset:0;
            background:var(--modal-overlay);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            z-index:1000;
            align-items:center;
            justify-content:center;
            padding:20px;
            opacity:0;
            transition:opacity 0.3s ease;
        }
        .modal-overlay.active { display:flex; opacity:1; }
        .modal-content {
            background:var(--bg-modal);
            backdrop-filter:blur(16px);
            border-radius:20px;
            max-width:95vw;
            max-height:95vh;
            padding:20px;
            position:relative;
            border:1px solid var(--border-color);
            box-shadow:0 30px 80px var(--shadow-color);
            transform:scale(0.95);
            transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
            opacity:0;
            display:flex;
            flex-direction:column;
            align-items:center;
            overflow:hidden;
        }
        .modal-overlay.active .modal-content { transform:scale(1); opacity:1; }
        .modal-content.closing { transform:scale(0.95); opacity:0; transition:all 0.2s ease; }

        .modal-close {
            position:absolute;
            top:16px;
            right:20px;
            width:44px;
            height:44px;
            border-radius:50%;
            border:none;
            background:var(--btn-preview-bg);
            color:var(--text-secondary);
            font-size:1.4rem;
            cursor:pointer;
            transition:0.2s;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:10;
            backdrop-filter:blur(4px);
        }
        .modal-close:hover { transform:rotate(90deg) scale(1.1); }
        .modal-filename {
            margin:12px 0 4px;
            font-size:0.95rem;
            color:var(--text-muted);
            text-align:center;
            max-width:100%;
            word-break:break-all;
        }

        /* ===== ПЛЕЕР (базовый) ===== */
        .player-wrapper {
            position:relative;
            width:100%;
            max-width:900px;
            background:#000;
            border-radius:12px;
            overflow:hidden;
            aspect-ratio:16/9;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .player-wrapper video, .player-wrapper audio {
            width:100%;
            height:100%;
            object-fit:contain;
            background:#000;
            display:block;
        }
        .player-wrapper video::-webkit-media-controls,

            if (type === 'video') return 'fa-video';

            if (['zip','rar','7z','tar','gz'].includes(ext)) return 'fa-file-archive';

            if (['apk'].includes(ext)) return 'fa-android';

            const m = Math.floor((sec%3600)/60);

            if (h>0) return `${h}ч ${m}м ${s}с`;
            if (m>0) return `${m}м ${s}с`;
            return `${s}с`;

            if (bytes >= 1048576) return (bytes/1048576).toFixed(1)+' МБ';
            if (bytes >= 1024) return (bytes/1024).toFixed(1)+' КБ';

            const type = file.type;
            if (type === 'image') {
                const dim = (m.width && m.height) ? `${m.width}×${m.height}` : '—';
                const date = m.date ? new Date(m.date).toLocaleDateString() : (file.modified ? new Date(file.modified).toLocaleDateString() : '—');
                return `<span><i class="fas fa-arrows-alt"></i> ${dim}</span><span><i class="fas fa-calendar"></i> ${date}</span>`;
            }
            if (type === 'video') {
                const dur = formatDuration(m.duration);
                const res = (m.width && m.height) ? `${m.width}×${m.height}` : '—';
                const codec = m.codec || '—';
                return `<span><i class="fas fa-clock"></i> ${dur}</span><span><i class="fas fa-expand"></i> ${res}</span><span><i class="fas fa-film"></i> ${codec}</span>`;
            }
            if (type === 'audio') {
                const dur = formatDuration(m.duration);
                const sr = m.sampleRate ? (m.sampleRate/1000).toFixed(1)+' кГц' : '—';
                const br = m.bitrate ? (m.bitrate/1000).toFixed(0)+' кбит/с' : '—';
                return `<span><i class="fas fa-clock"></i> ${dur}</span><span><i class="fas fa-waveform"></i> ${sr}</span><span><i class="fas fa-signal"></i> ${br}</span>`;
            }
            const date = file.modified ? new Date(file.modified).toLocaleDateString() : '—';
            return `<span><i class="fas fa-calendar"></i> ${date}</span>`;
        }

        function sortFiles(list) {
            const sorted = [...list];
            sorted.sort((a,b) => {
                let valA, valB;
                switch (currentSort) {
                    case 'name': valA = a.name.toLowerCase(); valB = b.name.toLowerCase(); break;
                    case 'size': valA = getFileSizeBytes(a.size); valB = getFileSizeBytes(b.size); break;
                    case 'date': valA = new Date(a.modified || 0); valB = new Date(b.modified || 0); break;
                    default: return 0;
                }
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });
            return sorted;
        }

        function getFilteredData() {
            let filtered = fileData;
            if (currentFilter !== 'all') filtered = filtered.filter(f => f.type === currentFilter);
            if (currentSearch) filtered = filtered.filter(f => f.name.toLowerCase().includes(currentSearch));
            return sortFiles(filtered);
        }

        function updateStats(list) {
            const total = list.length;
            let totalBytes = 0;
            list.forEach(f => totalBytes += getFileSizeBytes(f.size));
            document.getElementById('totalFiles').textContent = total;
            document.getElementById('totalSize').textContent = formatSize(totalBytes);
        }

        // ===== РЕНДЕР =====
        function renderFiles() {
            const list = getFilteredData();
            const container = document.getElementById('fileList');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div class="no-results"><i class="fas fa-search"></i> Совпадений не найдено</div>`;
                updateStats([]);
                return;
            }
            list.forEach((file, index) => {
                const url = BASE_URL + file.name;
                const icon = getIcon(file);
                const meta = renderMetadata(file);
                const canPreview = ['image','video','audio'].includes(file.type);
                const isText = /\.(txt|md|json|xml|yaml|yml|csv|log|sh|bat|ps1)$/i.test(file.name);
                const li = document.createElement('li');
                li.className = 'file-item';
                li.style.animationDelay = (index * 0.02) + 's';
                li.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon"><i class="fas ${icon}"></i></span>
                        <div class="file-details">
                            <a href="${url}" class="file-name" download>${file.name}</a>
                            <div class="file-meta ${showMeta ? '' : 'hidden'}">
                                <span><i class="fas fa-weight-hanging"></i> ${file.size}</span>
                                ${meta}
                            </div>
                        </div>
                    </div>
                    <div class="file-actions">
                        ${canPreview ? `<button class="btn btn-preview" data-url="${url}" data-name="${file.name}" data-type="${file.type}"><i class="fas fa-eye"></i> Смотреть</button>` : ''}
                        ${isText ? `<button class="btn btn-edit" data-url="${url}" data-name="${file.name}"><i class="fas fa-edit"></i></button>` : ''}
                        <button class="btn btn-copy" data-url="${url}" title="Копировать ссылку"><i class="fas fa-link"></i></button>
                        <a href="${url}" class="btn btn-newtab" target="_blank" title="Открыть в новой вкладке"><i class="fas fa-external-link-alt"></i></a>
                        <a href="${url}" class="btn btn-download" download><i class="fas fa-download"></i> Скачать</a>
                    </div>
                `;
                container.appendChild(li);
            });
            document.querySelectorAll('.btn-preview').forEach(btn => {
                btn.addEventListener('click', () => openPreview(btn.dataset.url, btn.dataset.name, btn.dataset.type));
            });
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => openEditor(btn.dataset.url, btn.dataset.name));
            });
            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(btn.dataset.url).then(() => {
                        btn.innerHTML = '<i class="fas fa-check"></i>';
                        setTimeout(() => btn.innerHTML = '<i class="fas fa-link"></i>', 2000);
                    });
                });
            });
            updateStats(list);
        }

        // ===== ПРОСМОТР (УПРОЩЁННЫЙ) =====
        function openPreview(url, name, type) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
                <div class="player-wrapper" id="playerWrapper">
                    <div id="playerContainer" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
                    <div class="custom-controls" id="customControls">
                        <div class="controls-row">
                            <button class="btn-ctrl" id="playBtn"><i class="fas fa-play"></i></button>
                            <div class="progress-container">
                                <span class="progress-time" id="currentTimeDisplay">0:00</span>
                                <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                                <span class="progress-time" id="durationDisplay">0:00</span>
                            </div>
                            <div class="volume-control">
                                <span class="vol-icon" id="volIcon"><i class="fas fa-volume-up"></i></span>
                                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                            </div>
                            <button class="fullscreen-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
                        </div>
                    </div>
                    <div class="pizza-spinner" id="pizzaSpinner">🍕</div>
                    <div class="buffering-indicator" id="bufferingIndicator"></div>
                </div>
                <div class="modal-filename">${name}</div>
            `;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            const wrapper = document.getElementById('playerWrapper');
            const container = document.getElementById('playerContainer');
            const spinner = document.getElementById('pizzaSpinner');
            const buffering = document.getElementById('bufferingIndicator');

            const closeHandler = () => closeModal();
            document.getElementById('modalClose').addEventListener('click', closeHandler);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeHandler(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHandler(); });

            if (type === 'image') {
                wrapper.style.aspectRatio = 'auto';
                document.querySelector('.custom-controls').style.display = 'none';
                spinner.style.display = 'none';
                const img = document.createElement('img');
                img.src = url;
                img.style.maxWidth = '90vw';
                img.style.maxHeight = '80vh';
                img.style.objectFit = 'contain';
                img.style.borderRadius = '12px';
                container.appendChild(img);
                return;
            }

            let media;
            if (type === 'video') {
                media = document.createElement('video');
                media.setAttribute('playsinline', '');
            } else {
                media = document.createElement('audio');
            }
            media.src = url;
            media.controls = false;
            media.style.width = '100%';
            media.style.height = '100%';
            media.style.display = 'block';
            media.style.background = '#000';
            container.appendChild(media);
            currentPlayer = media;

            spinner.classList.add('show');
            buffering.classList.remove('show');
            media.addEventListener('waiting', () => {
                buffering.classList.add('show');
                spinner.classList.add('show');
            });
            media.addEventListener('canplay', () => {
                buffering.classList.remove('show');
                spinner.classList.remove('show');
            });
            media.addEventListener('playing', () => {
                buffering.classList.remove('show');
                spinner.classList.remove('show');
            });

            const playBtn = document.getElementById('playBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            const volumeSlider = document.getElementById('volumeSlider');
            const volIcon = document.getElementById('volIcon');
            const fullscreenBtn = document.getElementById('fullscreenBtn');

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const h = Math.floor(seconds/3600);
                const m = Math.floor((seconds%3600)/60);
                const s = Math.floor(seconds%60);
                if (h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                return `${m}:${String(s).padStart(2,'0')}`;
            }

            function updateProgress() {
                if (!media) return;
                const percent = media.duration ? (media.currentTime/media.duration)*100 : 0;
                progressFill.style.width = percent + '%';
                currentTimeDisplay.textContent = formatTime(media.currentTime);
                durationDisplay.textContent = formatTime(media.duration);
            }

            media.addEventListener('timeupdate', updateProgress);
            media.addEventListener('loadedmetadata', () => durationDisplay.textContent = formatTime(media.duration));
            media.addEventListener('play', () => playBtn.innerHTML = '<i class="fas fa-pause"></i>');
            media.addEventListener('pause', () => playBtn.innerHTML = '<i class="fas fa-play"></i>');
            media.addEventListener('ended', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                progressFill.style.width = '0%';
                currentTimeDisplay.textContent = '0:00';
            });

            playBtn.addEventListener('click', () => media.paused ? media.play() : media.pause());
            progressBar.addEventListener('click', (e) => {
                const rect = progressBar.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                if (media.duration) media.currentTime = x * media.duration;
            });
            volumeSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                media.volume = val;
                updateVolumeIcon(val);
            });
            volIcon.addEventListener('click', () => {
                if (media.muted) { media.muted = false; volumeSlider.value = media.volume; }
                else { media.muted = true; volumeSlider.value = 0; }
                updateVolumeIcon(media.muted ? 0 : media.volume);
            });
            function updateVolumeIcon(val) {
                if (val === 0 || media.muted) volIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
                else if (val < 0.5) volIcon.innerHTML = '<i class="fas fa-volume-down"></i>';
                else volIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
            }
            volumeSlider.value = media.volume || 1;
            updateVolumeIcon(media.volume);

            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            });

            const keyHandler = (e) => {
                if (!overlay.classList.contains('active')) return;
                if (e.target.tagName === 'INPUT') return;
                switch (e.key) {
                    case ' ': e.preventDefault(); media.paused ? media.play() : media.pause(); break;
                    case 'ArrowRight': e.preventDefault(); media.currentTime = Math.min(media.currentTime + 5, media.duration || 0); break;
                    case 'ArrowLeft': e.preventDefault(); media.currentTime = Math.max(media.currentTime - 5, 0); break;
                    case 'ArrowUp': e.preventDefault(); media.volume = Math.min(1, media.volume + 0.1); volumeSlider.value = media.volume; updateVolumeIcon(media.volume); break;
                    case 'ArrowDown': e.preventDefault(); media.volume = Math.max(0, media.volume - 0.1); volumeSlider.value = media.volume; updateVolumeIcon(media.volume); break;
                    case 'f': case 'F': e.preventDefault(); fullscreenBtn.click(); break;
                }
            };
            document.addEventListener('keydown', keyHandler);
            media._keyHandler = keyHandler;

            media.play().catch(() => {});
        }

        // ===== РЕДАКТОР =====
        function openEditor(url, name) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            fetch(url)
                .then(r => r.text())
                .then(text => {
                    content.innerHTML = `
                        <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
                        <h3 style="margin:0 0 12px;color:var(--text-secondary);">Редактирование: ${name}</h3>
                        <textarea class="editor-textarea" id="editorText" style="width:100%;min-height:300px;background:rgba(0,0,0,0.3);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-family:monospace;font-size:0.9rem;padding:16px;resize:vertical;outline:none;">${text}</textarea>
                        <div style="display:flex;gap:10px;margin-top:12px;">
                            <button class="btn btn-download" id="editorDownload"><i class="fas fa-download"></i> Скачать изменённый</button>
                            <button class="btn btn-preview" id="editorClose"><i class="fas fa-times"></i> Закрыть</button>
                        </div>
                    `;
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                    document.getElementById('modalClose').addEventListener('click', closeModal);
                    document.getElementById('editorClose').addEventListener('click', closeModal);
                    document.getElementById('editorDownload').addEventListener('click', () => {
                        const newText = document.getElementById('editorText').value;
                        const blob = new Blob([newText], { type: 'text/plain' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = name;
                        a.click();
                    });
                });
        }

        // ===== ЗАКРЫТИЕ МОДАЛКИ =====
        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            if (!overlay.classList.contains('active')) return;
            content.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('active');
                content.classList.remove('closing');
                document.body.style.overflow = '';
                if (currentPlayer) {
                    currentPlayer.pause();
                    currentPlayer.currentTime = 0;
                    if (currentPlayer._keyHandler) document.removeEventListener('keydown', currentPlayer._keyHandler);
                    currentPlayer = null;
                }
                content.innerHTML = '';
            }, 200);
        }

        // ===== СТАТИСТИКА (ВКЛАДКА) =====
        let chartsInitialized = false;
        function initStats() {
            if (chartsInitialized) return;
            const list = fileData;
            const total = list.length;
            let totalBytes = 0;
            const typeCount = {};
            const extCount = {};
            let lastModified = 0;
            list.forEach(f => {
                totalBytes += getFileSizeBytes(f.size);
                const t = f.type || 'other';
                typeCount[t] = (typeCount[t] || 0) + 1;
                const ext = f.name.split('.').pop().toLowerCase();
                extCount[ext] = (extCount[ext] || 0) + 1;
                const m = new Date(f.modified || 0).getTime();
                if (m > lastModified) lastModified = m;
            });
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statSize').textContent = formatSize(totalBytes);
            document.getElementById('statTypes').textContent = Object.keys(typeCount).length;
            document.getElementById('statLastUpdated').textContent = lastModified ? new Date(lastModified).toLocaleString() : '—';

            const ctxPie = document.getElementById('pieChart').getContext('2d');
            const typeLabels = Object.keys(typeCount);
            const typeData = typeLabels.map(k => typeCount[k]);
            const colors = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#6b7280'];
            new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: typeLabels.map(l => l.charAt(0).toUpperCase() + l.slice(1)),
                    datasets: [{ data: typeData, backgroundColor: colors.slice(0, typeData.length), borderColor: 'var(--bg-item)', borderWidth: 2 }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: 'var(--text-muted)' } }
                    }
                }
            });
            const ctxBar = document.getElementById('barChart').getContext('2d');
            const sortedExts = Object.entries(extCount).sort((a,b) => b[1] - a[1]).slice(0,10);
            const barLabels = sortedExts.map(e => e[0]);
            const barData = sortedExts.map(e => e[1]);
            new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: barLabels,
                    datasets: [{ label: 'Количество файлов', data: barData, backgroundColor: 'var(--accent)', borderRadius: 4 }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: 'var(--text-muted)', stepSize: 1 } },
                        x: { ticks: { color: 'var(--text-muted)' } }
                    }
                }
            });
            chartsInitialized = true;
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'stats') initStats();
            });
        });

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        (function init() {
            // Восстановление темы
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === savedTheme);
            });
            // Неон
            const savedIntensity = parseInt(localStorage.getItem('neonIntensity')) || 100;
            const neonRange = document.getElementById('neonIntensity');
            neonRange.value = savedIntensity;
            document.getElementById('neonValue').textContent = savedIntensity + '%';
            document.documentElement.style.setProperty('--neon-intensity', savedIntensity / 100);
            neonRange.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                document.documentElement.style.setProperty('--neon-intensity', val / 100);
                document.getElementById('neonValue').textContent = val + '%';
                localStorage.setItem('neonIntensity', val);

            // Неон цвет
            const savedNeonColor = localStorage.getItem('neonColor') || '#a78bfa';

            document.documentElement.style.setProperty('--neon-glow', `rgba(${r},${g},${b},0.3)`);
            document.querySelectorAll('.preset-dot').forEach(dot => dot.classList.toggle('active', dot.dataset.color === savedNeonColor));
            document.getElementById('neonColorPicker').value = savedNeonColor;
            // Акцент
            const savedAccent = localStorage.getItem('accentColor') || '#2563eb';
            document.documentElement.style.setProperty('--accent', savedAccent);
            document.documentElement.style.setProperty('--accent-hover', savedAccent + 'cc');
            document.documentElement.style.setProperty('--accent-glow', savedAccent + '66');
            document.getElementById('accentColor').value = savedAccent;
            // Пресет темы
            const savedPreset = localStorage.getItem('themePreset');
            if (savedPreset) applyThemePreset(savedPreset);

            // Обработчики на кнопки
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const theme = btn.dataset.theme;
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                    document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
                });
            });
            document.querySelectorAll('.preset-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const color = dot.dataset.color;
                    document.documentElement.style.setProperty('--neon-color', color);
                    const r2 = parseInt(color.slice(1,3),16), g2 = parseInt(color.slice(3,5),16), b2 = parseInt(color.slice(5,7),16);
                    document.documentElement.style.setProperty('--neon-glow', `rgba(${r2},${g2},${b2},0.3)`);
                    localStorage.setItem('neonColor', color);
                    document.querySelectorAll('.preset-dot').forEach(d => d.classList.toggle('active', d.dataset.color === color));
                    document.getElementById('neonColorPicker').value = color;
                });
            });
            document.getElementById('neonColorPicker').addEventListener('input', (e) => {
                const color = e.target.value;
                document.documentElement.style.setProperty('--neon-color', color);
                const r2 = parseInt(color.slice(1,3),16), g2 = parseInt(color.slice(3,5),16), b2 = parseInt(color.slice(5,7),16);
                document.documentElement.style.setProperty('--neon-glow', `rgba(${r2},${g2},${b2},0.3)`);
                localStorage.setItem('neonColor', color);
                document.querySelectorAll('.preset-dot').forEach(d => d.classList.toggle('active', d.dataset.color === color));
            });
            document.getElementById('resetNeonColor').addEventListener('click', () => {
                const color = '#a78bfa';
                document.documentElement.style.setProperty('--neon-color', color);
                document.documentElement.style.setProperty('--neon-glow', `rgba(167,139,250,0.3)`);
                localStorage.setItem('neonColor', color);
                document.querySelectorAll('.preset-dot').forEach(d => d.classList.toggle('active', d.dataset.color === color));
                document.getElementById('neonColorPicker').value = color;
            });
            document.getElementById('accentColor').addEventListener('input', (e) => {
                const color = e.target.value;
                document.documentElement.style.setProperty('--accent', color);
                document.documentElement.style.setProperty('--accent-hover', color + 'cc');
                document.documentElement.style.setProperty('--accent-glow', color + '66');
                localStorage.setItem('accentColor', color);
            });
            document.querySelectorAll('.theme-preset-btn').forEach(btn => {
                btn.addEventListener('click', () => applyThemePreset(btn.dataset.themePreset));
            });
            function applyThemePreset(name) {
                const p = themePresets[name];
                if (!p) return;
                document.documentElement.style.setProperty('--bg-gradient', `radial-gradient(circle at 50% 0%, ${p.bg} 0%, #000 70%)`);
                document.documentElement.style.setProperty('--text-primary', p.text);
                document.documentElement.style.setProperty('--accent', p.accent);
                document.documentElement.style.setProperty('--neon-color', p.neon);
                localStorage.setItem('themePreset', name);
                document.querySelectorAll('.theme-preset-btn').forEach(b => b.classList.toggle('active', b.dataset.themePreset === name));
            }

            // Метаданные
            document.getElementById('toggleMetaBtn').addEventListener('click', () => {
                showMeta = !showMeta;
                document.getElementById('toggleMetaBtn').innerHTML = `<i class="fas fa-eye"></i> ${showMeta ? 'Метаданные' : 'Метаданные'}`;
                renderFiles();
            });

            // Сортировка
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sort = btn.dataset.sort;
                    if (currentSort === sort) sortAsc = !sortAsc;
                    else { currentSort = sort; sortAsc = true; }
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    btn.textContent = btn.textContent.replace(/[▲▼]/, '') + (sortAsc ? ' ▲' : ' ▼');
                    renderFiles();
                });
            });

            // Фильтры
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderFiles();
                });
            });

            // Поиск
            document.getElementById('search').addEventListener('input', (e) => {
                currentSearch = e.target.value.toLowerCase().trim();
                renderFiles();
            });

            // Закрытие модалки по Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('active')) {
                    closeModal();
                }
            });

            // Рендер при загрузке и при переходе на вкладку статистики
            renderFiles();
            // Если вкладка статистики уже активна — инициализировать
            if (document.querySelector('.tab-btn.active').dataset.tab === 'stats') initStats();

            // Дополнительно: при клике на вкладку статистики, если ещё не инициализирована
            document.querySelector('[data-tab="stats"]').addEventListener('click', () => {
                if (!chartsInitialized) initStats();
            });
        })();

        // ===== ГАРАНТИЯ РЕНДЕРА ПОСЛЕ ПОЛНОЙ ЗАГРУЗКИ =====
        document.addEventListener('DOMContentLoaded', function() {
            renderFiles();
        });
    </script>
</body>
</html>
