        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (translations[lang] && translations[lang][key] !== undefined) {
                    if (el.tagName === 'INPUT' && el.placeholder !== undefined) {
                        el.placeholder = translations[lang][key];
                    } else {
                        el.textContent = translations[lang][key];
                    }
                }
            });
            const titleEl = document.querySelector('.glow-title');
            if (titleEl) titleEl.textContent = translations[lang].title;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const key = btn.dataset.i18n;
                if (key && translations[lang][key]) {
                    const icon = btn.querySelector('i');
                    btn.innerHTML = `<i class="${icon.className}"></i> ${translations[lang][key]}`;
                }
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const key = btn.dataset.i18n;
                if (key && translations[lang][key]) {
                    const icon = btn.querySelector('i');
                    if (icon) btn.innerHTML = `<i class="${icon.className}"></i> ${translations[lang][key]}`;
                    else btn.textContent = translations[lang][key];
                }
            });
            document.querySelectorAll('.sort-btn').forEach(btn => {
                const key = btn.dataset.i18n;
                if (key && translations[lang][key]) {
                    const arrow = btn.textContent.includes('▲') ? ' ▲' : btn.textContent.includes('▼') ? ' ▼' : '';
                    btn.textContent = translations[lang][key] + arrow;
                }
            });

                const icon = metaBtn.querySelector('i');

        // ===== РЕНДЕР СПИСКА (с анимацией) =====
        function renderFiles() {
            const list = getFilteredData();
            const container = document.getElementById('fileList');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div class="no-results"><i class="fas fa-search"></i> ${translations[currentLang].noResults}</div>`;
                updateStats([]);
                return;
            }
            list.forEach((file, index) => {
                const url = BASE_URL + file.name;
                const icon = getIcon(file);
                const meta = renderMetadata(file);
                const canPreview = ['image','video','audio'].includes(file.type);
                const isText = /\.(txt|md|json|xml|yaml|yml|csv|log|sh|bat|ps1)$/i.test(file.name);

                const li = document.createElement('li');
                li.className = 'file-item';
                li.style.animationDelay = (index * 0.02) + 's';
                li.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon"><i class="fas ${icon}"></i></span>
                        <div class="file-details">
                            <a href="${url}" class="file-name" download>${file.name}</a>
                            <div class="file-meta ${showMeta ? '' : 'hidden'}">

                                ${meta}
                            </div>

                    </div>
                `;
                container.appendChild(li);
            });

            // Обработчики
            document.querySelectorAll('.btn-preview').forEach(btn => {
                btn.addEventListener('click', () => openPreview(btn.dataset.url, btn.dataset.name, btn.dataset.type));

            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => openEditor(btn.dataset.url, btn.dataset.name));

            document.querySelectorAll('.btn-copy').forEach(btn => {

                    navigator.clipboard.writeText(btn.dataset.url).then(() => {
                        btn.innerHTML = '<i class="fas fa-check"></i>';
                        setTimeout(() => btn.innerHTML = '<i class="fas fa-link"></i>', 2000);
                    });
                });
            });

            updateStats(list);

        // ===== ПЛЕЕР И ПРОСМОТР ФОТО (улучшенный) =====
        function openPreview(url, name, type) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            // Очищаем
            content.innerHTML = `
                <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
                <div class="player-wrapper" id="playerWrapper">
                    <div id="playerContainer" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;"></div>

                            <div class="progress-container">

                <div class="modal-filename" id="modalFilename">${name}</div>
            `;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            const wrapper = document.getElementById('playerWrapper');
            const container = document.getElementById('playerContainer');
            const spinner = document.getElementById('pizzaSpinner');
            const buffering = document.getElementById('bufferingIndicator');

            // Функция закрытия
            const closeHandler = () => closeModal();
            document.getElementById('modalClose').addEventListener('click', closeHandler);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeHandler(); });
            // Удаляем старый обработчик, если был
            if (modalCloseHandler) {
                document.removeEventListener('keydown', modalCloseHandler);
            }
            modalCloseHandler = (e) => { if (e.key === 'Escape') closeHandler(); };
            document.addEventListener('keydown', modalCloseHandler);

            if (type === 'image') {
                // === ФОТО с зумом ===
                wrapper.style.aspectRatio = 'auto';
                document.querySelector('.custom-controls').style.display = 'none';
                spinner.style.display = 'none';

                const photoDiv = document.createElement('div');
                photoDiv.className = 'photo-container';
                const img = document.createElement('img');
                img.src = url;
                img.alt = name;
                img.style.maxWidth = '100%';
                img.style.maxHeight = '80vh';
                img.style.objectFit = 'contain';
                img.style.transition = 'transform 0.2s';
                img.style.cursor = 'grab';
                photoDiv.appendChild(img);
                container.appendChild(photoDiv);

                // Контролы зума
                const controls = document.createElement('div');
                controls.className = 'photo-controls show';
                controls.innerHTML = `
                    <button id="zoomIn" title="${translations[currentLang].zoomIn}"><i class="fas fa-plus"></i></button>
                    <button id="zoomReset" title="${translations[currentLang].zoomReset}"><i class="fas fa-expand"></i></button>
                    <button id="zoomOut" title="${translations[currentLang].zoomOut}"><i class="fas fa-minus"></i></button>
                `;
                wrapper.appendChild(controls);

                let zoom = 1;
                const step = 0.2;
                const maxZoom = 4;
                const minZoom = 0.5;

                function updateZoom() {
                    img.style.transform = `scale(${zoom})`;
                }

                document.getElementById('zoomIn').addEventListener('click', () => {
                    zoom = Math.min(zoom + step, maxZoom);
                    updateZoom();
                });
                document.getElementById('zoomOut').addEventListener('click', () => {
                    zoom = Math.max(zoom - step, minZoom);
                    updateZoom();
                });
                document.getElementById('zoomReset').addEventListener('click', () => {
                    zoom = 1;
                    updateZoom();
                });
                // Колесико мыши
                img.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -step : step;
                    zoom = Math.min(Math.max(zoom + delta, minZoom), maxZoom);
                    updateZoom();
                }, { passive: false });

                // Перетаскивание при зуме
                let isDragging = false;
                let startX, startY, translateX = 0, translateY = 0;
                img.addEventListener('mousedown', (e) => {
                    if (zoom === 1) return;
                    isDragging = true;
                    startX = e.clientX - translateX;
                    startY = e.clientY - translateY;
                    img.style.cursor = 'grabbing';
                });
                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    translateX = e.clientX - startX;
                    translateY = e.clientY - startY;
                    img.style.transform = `scale(${zoom}) translate(${translateX/zoom}px, ${translateY/zoom}px)`;
                });
                document.addEventListener('mouseup', () => {
                    isDragging = false;
                    img.style.cursor = 'grab';
                });

                // Показывать контролы при наведении
                wrapper.addEventListener('mouseenter', () => controls.classList.add('show'));
                wrapper.addEventListener('mouseleave', () => controls.classList.remove('show'));

                return;
            }

            // === ВИДЕО / АУДИО ===
            let media;
            if (type === 'video') {
                media = document.createElement('video');
                media.setAttribute('playsinline', '');
            } else {
                media = document.createElement('audio');
            }
            media.src = url;
            media.controls = false;
            media.style.width = '100%';
            media.style.height = '100%';
            media.style.display = 'block';
            media.style.background = '#000';
            container.appendChild(media);
            currentPlayer = media;

            // Пицца и буферизация
            spinner.classList.add('show');
            buffering.classList.remove('show');
            media.addEventListener('waiting', () => {
                buffering.classList.add('show');
                spinner.classList.add('show');
            });
            media.addEventListener('canplay', () => {
                buffering.classList.remove('show');
                spinner.classList.remove('show');
            });
            media.addEventListener('playing', () => {
                buffering.classList.remove('show');
                spinner.classList.remove('show');
            });

            // Контролы
            const playBtn = document.getElementById('playBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            const volumeSlider = document.getElementById('volumeSlider');
            const volIcon = document.getElementById('volIcon');
            const fullscreenBtn = document.getElementById('fullscreenBtn');

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const h = Math.floor(seconds/3600);
                const m = Math.floor((seconds%3600)/60);
                const s = Math.floor(seconds%60);
                if (h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                return `${m}:${String(s).padStart(2,'0')}`;
            }

            function updateProgress() {
                if (!media) return;
                const percent = media.duration ? (media.currentTime/media.duration)*100 : 0;
                progressFill.style.width = percent + '%';
                currentTimeDisplay.textContent = formatTime(media.currentTime);
                durationDisplay.textContent = formatTime(media.duration);
            }

            media.addEventListener('timeupdate', updateProgress);
            media.addEventListener('loadedmetadata', () => durationDisplay.textContent = formatTime(media.duration));
            media.addEventListener('play', () => playBtn.innerHTML = '<i class="fas fa-pause"></i>');
            media.addEventListener('pause', () => playBtn.innerHTML = '<i class="fas fa-play"></i>');
            media.addEventListener('ended', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                progressFill.style.width = '0%';
                currentTimeDisplay.textContent = '0:00';
            });

            playBtn.addEventListener('click', () => media.paused ? media.play() : media.pause());

            progressBar.addEventListener('click', (e) => {
                const rect = progressBar.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                if (media.duration) media.currentTime = x * media.duration;
            });

            volumeSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                media.volume = val;
                updateVolumeIcon(val);
            });

            volIcon.addEventListener('click', () => {
                if (media.muted) { media.muted = false; volumeSlider.value = media.volume; }
                else { media.muted = true; volumeSlider.value = 0; }
                updateVolumeIcon(media.muted ? 0 : media.volume);
            });

            function updateVolumeIcon(val) {
                if (val === 0 || media.muted) volIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
                else if (val < 0.5) volIcon.innerHTML = '<i class="fas fa-volume-down"></i>';
                else volIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
            }
            volumeSlider.value = media.volume || 1;
            updateVolumeIcon(media.volume);

            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            });

            // Горячие клавиши для плеера
            const keyHandler = (e) => {
                if (!overlay.classList.contains('active')) return;
                if (e.target.tagName === 'INPUT') return;
                switch (e.key) {
                    case ' ': e.preventDefault(); media.paused ? media.play() : media.pause(); break;
                    case 'ArrowRight': e.preventDefault(); media.currentTime = Math.min(media.currentTime + 5, media.duration || 0); break;
                    case 'ArrowLeft': e.preventDefault(); media.currentTime = Math.max(media.currentTime - 5, 0); break;
                    case 'ArrowUp': e.preventDefault(); media.volume = Math.min(1, media.volume + 0.1); volumeSlider.value = media.volume; updateVolumeIcon(media.volume); break;
                    case 'ArrowDown': e.preventDefault(); media.volume = Math.max(0, media.volume - 0.1); volumeSlider.value = media.volume; updateVolumeIcon(media.volume); break;
                    case 'f': case 'F': e.preventDefault(); fullscreenBtn.click(); break;
                }
            };
            document.addEventListener('keydown', keyHandler);
            media._keyHandler = keyHandler;

            const navHandler = (e) => {
                if (!overlay.classList.contains('active')) return;
                if (e.target.tagName === 'INPUT') return;
                const list = getFilteredData();
                const idx = list.findIndex(f => f.name === name);
                if (e.key === 'j' || e.key === 'J') {
                    e.preventDefault();
                    const next = list[(idx + 1) % list.length];
                    if (next) openPreview(BASE_URL + next.name, next.name, next.type);
                } else if (e.key === 'k' || e.key === 'K') {
                    e.preventDefault();
                    const prev = list[(idx - 1 + list.length) % list.length];
                    if (prev) openPreview(BASE_URL + prev.name, prev.name, prev.type);
                }
            };
            document.addEventListener('keydown', navHandler);
            media._navHandler = navHandler;

            // Автозапуск
            media.play().catch(() => {});
        }

        // ===== РЕДАКТОР (как раньше) =====
        function openEditor(url, name) { /* ... */ }

        // ===== ЗАКРЫТИЕ МОДАЛКИ (исправленное) =====
        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            if (!overlay.classList.contains('active')) return; // защита

            content.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('active');
                content.classList.remove('closing');
                document.body.style.overflow = '';
                // Очистка плеера
                if (currentPlayer) {
                    currentPlayer.pause();
                    currentPlayer.currentTime = 0;
                    if (currentPlayer._keyHandler) document.removeEventListener('keydown', currentPlayer._keyHandler);
                    if (currentPlayer._navHandler) document.removeEventListener('keydown', currentPlayer._navHandler);
                    currentPlayer = null;
                }
                if (modalCloseHandler) {
                    document.removeEventListener('keydown', modalCloseHandler);
                    modalCloseHandler = null;
                }
                content.innerHTML = ''; // очищаем
            }, 200);
        }

        // ===== СТАТИСТИКА (как раньше) =====
        function initStats() { /* ... */ }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.addEventListener('DOMContentLoaded', () => {
            // Принудительный рендер после загрузки DOM
            renderFiles();
            // Если вкладка статистики активна - инициализировать
            if (document.querySelector('.tab-btn.active').dataset.tab === 'stats') initStats();
        });

        // Остальные обработчики (темы, неон, фильтры, сортировка, поиск, язык)
        // ... (всё как раньше, но уже есть setLanguage и прочее)
        // Я их не повторяю для краткости, они есть в предыдущих версиях.
        // Важно: все они должны быть определены до вызова renderFiles.

        // ===== ДОПОЛНИТЕЛЬНО: Ручной вызов рендера при первом клике (для надёжности) =====
        document.querySelectorAll('.filter-btn, .sort-btn, .tab-btn').forEach(el => {
            el.addEventListener('click', () => {
                // Если вдруг список пуст - перерендерим
                if (document.getElementById('fileList').children.length === 0) {
                    renderFiles();
                }
            });
        });

        // Запуск
        setLanguage(currentLang);
        // Темы, неон и прочее инициализируются здесь же (как в предыдущих версиях)
        // ...
    </script>
