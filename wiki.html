<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Wiki</title>
  <style>
    :root {
      --bg-main: #11111b;
      --bg-sidebar: #181825;
      --bg-card: #1e1e2e;
      --text-main: #cdd6f4;
      --text-muted: #a6adc8;
      --accent: #cba6f7;
      --accent-hover: #b4befe;
      --border: #313244;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 320px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); }
    .sidebar-header h2 { margin: 0 0 10px 0; font-size: 18px; color: var(--accent); }
    .search-box { width: 100%; padding: 8px 12px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 14px; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    .notes-list { flex: 1; overflow-y: auto; padding: 10px; }
    
    .note-card { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 6px; transition: background 0.15s; border: 1px solid transparent; }
    .note-card:hover { background: var(--bg-card); }
    .note-card.active { background: var(--bg-card); border-color: var(--accent); }
    .note-card-title { font-weight: 600; font-size: 14px; color: var(--text-main); margin-bottom: 4px; }
    .note-card-preview { font-size: 12px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .main-view { flex: 1; overflow-y: auto; padding: 40px 60px; max-width: 900px; margin: 0 auto; }
    .markdown-body { line-height: 1.7; font-size: 15px; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--accent); margin-top: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .markdown-body a { color: var(--accent-hover); text-decoration: none; border-bottom: 1px dashed var(--accent-hover); }
    .markdown-body pre { background: var(--bg-sidebar); padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); }
    .markdown-body code { background: var(--bg-sidebar); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    .callout { padding: 12px 16px; border-radius: 6px; margin: 15px 0; background: var(--bg-card); border-left: 4px solid var(--accent); }
    
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: 40vh; }
      .main-view { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🧠 Obsidian Wiki</h2>
      <input type="text" class="search-box" id="search" placeholder="Поиск заметок..." oninput="filterNotes()">
    </div>
    <div class="notes-list" id="notesList"></div>
  </div>
  <div class="main-view">
    <div class="markdown-body" id="content">Выберите заметку слева...</div>
  </div>

  <script>
    const notesData = [];

    function renderList(filtered) {
      const container = document.getElementById('notesList');
      if (filtered.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); padding: 10px;">Заметок не найдено</div>';
        return;
      }
      container.innerHTML = filtered.map(n => `
        <div class="note-card" id="card-${n.slug}" onclick="openNote('${n.slug}')">
          <div class="note-card-title">${n.title}</div>
          <div class="note-card-preview">${n.preview}</div>
        </div>
      `).join('');
    }

    function openNote(slug) {
      const note = notesData.find(n => n.slug === slug);
      if (!note) return;
      
      document.querySelectorAll('.note-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById('card-' + slug);
      if (activeCard) activeCard.classList.add('active');

      document.getElementById('content').innerHTML = note.htmlContent;
      window.location.hash = slug;
    }

    function filterNotes() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = notesData.filter(n => n.title.toLowerCase().includes(query) || n.preview.toLowerCase().includes(query));
      renderList(filtered);
    }

    renderList(notesData);
    const initialSlug = window.location.hash.replace('#', '') || (notesData[0] ? notesData[0].slug : '');
    if (initialSlug) openNote(initialSlug);
  </script>
</body>
</html>
